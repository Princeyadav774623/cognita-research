# Must live at the repository root: GitHub Actions only reads
# .github/workflows/ from there, so this file previously sat inside
# research-assistant/ and had never run — not once. Paths below are therefore
# relative to the repo root, not to the project directory.
name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest

    # The app refuses to start on SQLite (db.py raises), yet CI ran the whole
    # suite against it — so pgvector queries, the set_config tenant scoping and
    # the ADD COLUMN migrations were covered by nothing. This is the same image
    # the app actually runs on.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cognita_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies (Tesseract)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng libpq-dev

      - name: Install Python dependencies
        run: |
          cd research-assistant/backend
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create the low-privilege runtime role
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d cognita_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE cognita_app LOGIN PASSWORD 'cognita_ci';
          GRANT CONNECT ON DATABASE cognita_test TO cognita_app;
          GRANT USAGE ON SCHEMA public TO cognita_app;
          SQL

      - name: Run Pytest Test Suite
        env:
          GROQ_API_KEY: "test_groq_key"
          TAVILY_API_KEY: "test_tavily_key"
          SUPABASE_URL: "https://test.supabase.co"
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/cognita_test"
          APP_DATABASE_URL: "postgresql://cognita_app:cognita_ci@localhost:5432/cognita_test"
        run: |
          cd research-assistant/backend
          PYTHONPATH=. pytest tests/ -v

      # Verifies tenant isolation is actually enforced by Postgres, not just
      # that the policy statements ran. Needs a real database, which is why it
      # could not exist before.
      - name: Verify Row-Level Security blocks cross-tenant reads
        env:
          GROQ_API_KEY: "test_groq_key"
          TAVILY_API_KEY: "test_tavily_key"
          SUPABASE_URL: "https://test.supabase.co"
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/cognita_test"
          APP_DATABASE_URL: "postgresql://cognita_app:cognita_ci@localhost:5432/cognita_test"
        run: |
          cd research-assistant/backend
          PYTHONPATH=. python scripts/verify_rls.py

      # The landing page claims the golden set fails the build on regression.
      # Without this step that sentence was not true.
      - name: Golden evaluation set
        env:
          GROQ_API_KEY: "test_groq_key"
          TAVILY_API_KEY: "test_tavily_key"
          SUPABASE_URL: "https://test.supabase.co"
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/cognita_test"
          APP_DATABASE_URL: "postgresql://cognita_app:cognita_ci@localhost:5432/cognita_test"
        run: |
          cd research-assistant/backend
          PYTHONPATH=. pytest tests/test_evals.py -v

  frontend-build:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: research-assistant/frontend/package-lock.json

      - name: Install Node dependencies
        run: |
          cd research-assistant/frontend
          npm ci

      - name: Typecheck and Build Bundle
        run: |
          cd research-assistant/frontend
          npm run build

      - name: Frontend unit tests
        run: |
          cd research-assistant/frontend
          npm run test

  # ------------------------------------------------------------------ veracity
  # A second product in this repository, with its own suite, its own database
  # and its own ffmpeg dependency. Filtered on paths so a change to one product
  # does not spend minutes running the other's tests.
  veracity:
    name: Veracity backend
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector, not plain postgres: the schema declares a vector column and
        # a suite running without the extension would cover none of retrieval.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: veracity_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        # The ingestion tests decode real media. Without this they would be
        # skipped or, worse, silently assert on an error path.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: veracity/backend/requirements.txt

      - name: Install dependencies
        run: |
          cd veracity/backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create the low-privilege role
        # Two roles, or row-level security has no effect: the owner bypasses
        # every policy. The isolation tests assert against this role, so CI has
        # to have it or those tests pass for the wrong reason.
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d veracity_test -c \
            "CREATE ROLE veracity_app LOGIN PASSWORD 'veracity_local'"
          psql -h localhost -U postgres -d veracity_test -c \
            "GRANT USAGE ON SCHEMA public TO veracity_app"
          psql -h localhost -U postgres -d veracity_test -c \
            "CREATE EXTENSION IF NOT EXISTS vector"

      - name: Test
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/veracity_test
          TEST_DATABASE_URL_APP: postgresql://veracity_app:veracity_local@localhost:5432/veracity_test
          GROQ_API_KEY: not-used-the-suite-stubs-transcription
          USER: postgres
        run: |
          cd veracity/backend
          python -m pytest tests -q

      - name: Tenant isolation is actually enforced
        # Separate from the suite on purpose: policies existing and policies
        # working are different claims, and only the second is worth a green
        # check.
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/veracity_test
          TEST_DATABASE_URL_APP: postgresql://veracity_app:veracity_local@localhost:5432/veracity_test
          GROQ_API_KEY: not-used
          USER: postgres
        run: |
          cd veracity/backend
          python -m pytest tests/test_rls.py tests/test_migrations.py -q

  veracity-frontend:
    name: Veracity frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: cd veracity/frontend && npm install
      - name: Typecheck and build
        # No test suite here yet, so the build is the gate: it runs tsc, which
        # catches the API-shape drift that is the likeliest frontend defect.
        run: cd veracity/frontend && npm run build
