server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # The API is proxied through the same origin the app is served from, so the
    # browser sends no preflight and there is no CORS configuration to keep in
    # step between environments.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Uploads are large and transcription is slow; the defaults here are 60s
        # and would cut a two-gigabyte upload off mid-stream.
        client_max_body_size 2048m;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
    }

    location /health {
        proxy_pass http://api:8080/health;
    }

    # Hashed assets never change under the same name, so they can be cached
    # indefinitely. index.html must not be, or a deploy is invisible until
    # someone clears their cache.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
