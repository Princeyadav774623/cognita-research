# Four services: a database, an API, a worker, and the static frontend.
#
# The API and the worker are the same image with different commands. They share
# code, configuration and migrations, and splitting them into two images would
# mean two things to keep in step for no benefit — what differs is only which
# process starts.

name: veracity

services:
  db:
    # pgvector, not plain postgres. The schema declares a vector column; on a
    # stock image the first migration fails on `type "vector" does not exist`.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: veracity
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: veracity
      # Read by init-roles.sql when it creates the runtime role.
      APP_PASSWORD: ${APP_PASSWORD:?set APP_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
      # Creates the low-privilege role on first boot. Without a second role the
      # row-level security policies are installed and silently inert, because
      # the owner bypasses them.
      - ./deploy/init-roles.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veracity -d veracity"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./backend
    environment: &backend-env
      DATABASE_URL: postgresql://veracity:${POSTGRES_PASSWORD}@db:5432/veracity
      DATABASE_URL_APP: postgresql://veracity_app:${APP_PASSWORD:?set APP_PASSWORD in .env}@db:5432/veracity
      GROQ_API_KEY: ${GROQ_API_KEY:?set GROQ_API_KEY in .env}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      SUPABASE_JWKS_URL: ${SUPABASE_JWKS_URL:-}
      JWT_SECRET: ${JWT_SECRET:-}
      # Off by default in a deployed environment. Guest mode makes every
      # unauthenticated request the same user, which means tenant isolation
      # separates nothing.
      ALLOW_GUEST: ${ALLOW_GUEST:-false}
      ALLOW_REMOTE_FETCH: ${ALLOW_REMOTE_FETCH:-false}
      MEDIA_ROOT: /var/lib/veracity/media
      # With STORAGE_BACKEND=s3 the API and the worker share nothing but the
      # database and the bucket, so they can run on different machines. Left at
      # "local" they must share a filesystem, which the volume below provides.
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      S3_BUCKET: ${S3_BUCKET:-veracity}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - media:/var/lib/veracity/media
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8080}:8080"
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    environment: *backend-env
    volumes:
      - media:/var/lib/veracity/media
    depends_on:
      db:
        condition: service_healthy
      # Started after the API so migrations have run once before the worker
      # begins claiming jobs against the schema.
      api:
        condition: service_started
    command: ["python", "-m", "app.jobs.worker"]
    # Safe to raise: jobs are claimed with FOR UPDATE SKIP LOCKED, so workers
    # never take the same one twice.
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
    restart: unless-stopped

  web:
    build:
      context: ./frontend
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-5174}:8080"
    restart: unless-stopped

  # Local S3, so the multi-host path can be exercised without an AWS account.
  # Start it with: docker compose --profile s3 up
  minio:
    image: minio/minio:latest
    profiles: ["s3"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Creates the bucket once, then exits. A bucket that has to be made by hand
  # is a step someone forgets exactly once, in production.
  minio-init:
    image: minio/mc:latest
    profiles: ["s3"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000
        ${AWS_ACCESS_KEY_ID:-minioadmin} ${AWS_SECRET_ACCESS_KEY:-minioadmin} &&
      mc mb --ignore-existing local/${S3_BUCKET:-veracity}
      "

volumes:
  db-data:
  media:
  minio-data:
