</style><text class="eyb" x="30" y="24" fill="#6b6965">DEEP RESEARCH — ONE REQUEST, TIER BY TIER</text><rect x="24" y="40" width="832" height="96" rx="18" fill="#f4f1e9" stroke="#ddd8cc" stroke-width="1.1"/><text class="eyb" x="40" y="61" fill="#6b6965">PRESENTATION</text><rect x="56" y="68" width="200" height="52" rx="12" fill="#fdf6f3" stroke="#a94b2f" stroke-width="1.5" filter="url(#card)"/><text class="ttl" x="156.0" y="92.0">Query page</text><text class="sub" x="156.0" y="107.0">/#research</text><rect x="288" y="68" width="200" height="52" rx="12" fill="#fdf6f3" stroke="#a94b2f" stroke-width="1.5" filter="url(#card)"/><text class="ttl" x="388.0" y="92.0">Pipeline animation</text><text class="sub" x="388.0" y="107.0">driven by progress events</text><rect x="520" y="68" width="200" height="52" rx="12" fill="#fdf6f3" stroke="#a94b2f" stroke-width="1.5" filter="url(#card)"/><text class="ttl" x="620.0" y="92.0">Report view</text><text class="sub" x="620.0" y="107.0">sources, confidence, export</text><g filter="url(#card)"><path d="M744,75 a44.0,7 0 0,1 88,0 v38 a44.0,7 0 0,1 -88,0 z" fill="#eef4f4" stroke="#1d5f63" stroke-width="1.4"/><path d="M744,75 a44.0,7 0 0,0 88,0" fill="none" stroke="#1d5f63" stroke-width="1.4"/></g><text class="ttl" x="788.0" y="98.0">history</text><rect x="24" y="168" width="832" height="152" rx="18" fill="#f4f1e9" stroke="#ddd8cc" stroke-width="1.1"/><text class="eyb" x="40" y="189" fill="#6b6965">APPLICATION</text><rect x="56" y="196" width="200" height="52" rx="12" fill="#fdf6f3" stroke="#a94b2f" stroke-width="1.5" filter="url(#card)"/><text class="ttl" x="156.0" y="220.0">WebSocket endpoint</text><text class="sub" x="156.0" y="235.0">/ws/research</text><rect x="288" y="196" width="200" height="52" rx="12" fill="#fdf6f3" stroke="#a94b2f" stroke-width="1.5" filter="url(#card)"/><text class="ttl" x="388.0" y="220.0">Quota gate</text><text class="sub" x="388.0" y="235.0">consume, refund on failure</text><rect x="520" y="196" width="312" height="52" rx="12" fill="#fdf6f3" stroke="#a94b2f" stroke-width="1.5" filter="url(#card)"/><text class="ttl" x="676.0" y="220.0">LangGraph state machine</text><text class="sub" x="676.0" y="235.0">nine nodes, one conditional edge back to search</text><rect x="56" y="262" width="432" height="46" rx="12" fill="#fdf6f3" stroke="#a94b2f" stroke-width="1.5" filter="url(#card)"/><text class="ttl" x="272.0" y="283.0">invoke_with_retry</text><text class="sub" x="272.0" y="298.0">classify transient vs permanent · log every model substitution</text><rect x="520" y="262" width="312" height="46" rx="12" fill="#fdf6f3" stroke="#a94b2f" stroke-width="1.5" filter="url(#card)"/><text class="ttl" x="676.0" y="283.0">token ledger</text><text class="sub" x="676.0" y="298.0">usage accumulated per run, persisted with the session</text><rect x="24" y="352" width="400" height="96" rx="18" fill="#f4f1e9" stroke="#ddd8cc" stroke-width="1.1"/><text class="eyb" x="40" y="373" fill="#6b6965">PERSISTENCE</text><g filter="url(#card)"><path d="M56,389 a80.0,7 0 0,1 160,0 v36 a80.0,7 0 0,1 -160,0 z" fill="#eef4f4" stroke="#1d5f63" stroke-width="1.4"/><path d="M56,389 a80.0,7 0 0,0 160,0" fill="none" stroke="#1d5f63" stroke-width="1.4"/></g><text class="ttl" x="136.0" y="411.0">research_sessions</text><g filter="url(#card)"><path d="M240,389 a76.0,7 0 0,1 152,0 v36 a76.0,7 0 0,1 -152,0 z" fill="#eef4f4" stroke="#1d5f63" stroke-width="1.4"/><path d="M240,389 a76.0,7 0 0,0 152,0" fill="none" stroke="#1d5f63" stroke-width="1.4"/></g><text class="ttl" x="316.0" y="411.0">quota</text><rect x="456" y="352" width="400" height="96" rx="18" fill="#f4f1e9" stroke="#ddd8cc" stroke-width="1.1"/><text class="eyb" x="472" y="373" fill="#6b6965">EXTERNAL</text><path d="M492,380 L598,380 L586,432 L480,432 z" fill="#f9f2f6" stroke="#6b3352" stroke-width="1.4" filter="url(#card)"/><text class="ttl" x="539.0" y="404.0">Search</text><text class="sub" x="539.0" y="419.0">sub-queries</text><path d="M628,380 L724,380 L712,432 L616,432 z" fill="#f9f2f6" stroke="#6b3352" stroke-width="1.4" filter="url(#card)"/><text class="ttl" x="670.0" y="404.0">Pages</text><text class="sub" x="670.0" y="419.0">HTML / PDF</text><path d="M752,380 L836,380 L824,432 L740,432 z" fill="#f9f2f6" stroke="#6b3352" stroke-width="1.4" filter="url(#card)"/><text class="ttl" x="788.0" y="404.0">Groq</text><text class="sub" x="788.0" y="419.0">20B / 120B</text><path class="lna" d="M156,120 L156,192"/><path class="lna" d="M256,222 L284,222"/><path class="lna" d="M488,222 L516,222"/><path class="lna" d="M676,248 L676,258"/><path class="lnp" d="M832,222 L841.0,222.0 Q850,222 850.0,231.0 L850.0,331.0 Q850,340 841.0,340.0 L797.0,340.0 Q788,340 788.0,349.0 L788,376"/><path class="lna" d="M272,248 L272,258"/><path class="lnt" d="M136,308 L136,378"/><rect x="448" y="137.5" width="255" height="12.5" rx="3" fill="#fbfaf7" fill-opacity=".88"/><text class="note" x="452" y="146.0" fill="#6b6965">every runtime query uses the low-privilege role,</text><rect x="448" y="151.0" width="229" height="12.5" rx="3" fill="#fbfaf7" fill-opacity=".88"/><text class="note" x="452" y="159.5" fill="#6b6965">so row-level security applies to every read</text><rect x="24" y="466" width="12" height="12" rx="4" fill="#fff" stroke="#a94b2f" stroke-width="1.6"/><text class="lbl" x="42" y="475.5">process</text><rect x="86.4" y="466" width="12" height="12" rx="4" fill="#fff" stroke="#1d5f63" stroke-width="1.6"/><text class="lbl" x="104.4" y="475.5">data at rest</text><rect x="174.8" y="466" width="12" height="12" rx="4" fill="#fff" stroke="#6b3352" stroke-width="1.6"/><text class="lbl" x="192.8" y="475.5">external service</text></svg>