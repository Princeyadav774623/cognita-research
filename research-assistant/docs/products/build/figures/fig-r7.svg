rd)"/><text class="ttl" x="765.0" y="66.0">reporting</text><rect x="680" y="168" width="170" height="52" rx="12" fill="#eef5f0" stroke="#2f7d55" stroke-width="1.5" filter="url(#card)"/><text class="ttl" x="765.0" y="198.0">complete</text><rect x="680" y="268" width="170" height="52" rx="12" fill="#eef5f0" stroke="#2f7d55" stroke-width="1.5" filter="url(#card)"/><text class="ttl" x="765.0" y="292.0">declined</text><text class="sub" x="765.0" y="307.0">low confidence</text><rect x="680" y="368" width="170" height="52" rx="12" fill="#fbf0ee" stroke="#b3402f" stroke-width="1.5" filter="url(#card)"/><text class="ttl" x="765.0" y="392.0">failed</text><text class="sub" x="765.0" y="407.0">provider or network</text><path class="lna" d="M600,310 L631.0,310.0 Q640,310 640.0,301.0 L640.0,71.0 Q640,62 649.0,62.0 L676,62"/><rect x="592" y="167.5" width="49" height="12.5" rx="3" fill="#fbfaf7" fill-opacity=".88"/><text class="note" x="596" y="176.0" fill="#a94b2f">evidence</text><rect x="592" y="181.0" width="60" height="12.5" rx="3" fill="#fbfaf7" fill-opacity=".88"/><text class="note" x="596" y="189.5" fill="#a94b2f">sufficient</text><path class="lnt" d="M765,88 L765,164"/><path class="lna dash" d="M600,326 L617.0,326.0 Q626,326 626.0,317.0 L626.0,303.0 Q626,294 635.0,294.0 L676,294"/><rect x="609.2" y="341.5" width="85.6" height="13" rx="4" fill="#fbfaf7" fill-opacity=".95"/><text class="lblc" x="652" y="350">ceiling reached</text><path class="lna dash" d="M410,352 L359.0,352.0 Q350,352 350.0,361.0 L350.0,385.0 Q350,394 359.0,394.0 L676,394"/><rect x="388" y="377.5" width="235" height="12.5" rx="3" fill="#fbfaf7" fill-opacity=".88"/><text class="note" x="392" y="386.0" fill="#b3402f">any state, on unrecoverable provider failure</text><path class="lna dash" d="M410,326 L387.0,326.0 Q378,326 378.0,335.0 L378.0,431.0 Q378,440 369.0,440.0 L244.0,440.0 Q235,440 235.0,431.0 L235,352"/><rect x="215.32" y="449.5" width="181.36" height="13" rx="4" fill="#fbfaf7" fill-opacity=".95"/><text class="lblc" x="306" y="458">insufficient and iterations remain</text><rect x="36" y="87.5" width="111" height="12.5" rx="3" fill="#fbfaf7" fill-opacity=".88"/><text class="note" x="40" y="96.0" fill="#6b6965">quota is consumed on</text><rect x="36" y="101.0" width="101" height="12.5" rx="3" fill="#fbfaf7" fill-opacity=".88"/><text class="note" x="40" y="109.5" fill="#6b6965">entry and refunded</text><rect x="36" y="114.5" width="90" height="12.5" rx="3" fill="#fbfaf7" fill-opacity=".88"/><text class="note" x="40" y="123.0" fill="#6b6965">if the run fails</text><rect x="40" y="480" width="12" height="12" rx="4" fill="#fff" stroke="#a94b2f" stroke-width="1.6"/><text class="lbl" x="58" y="489.5">in progress</text><rect x="123.2" y="480" width="12" height="12" rx="4" fill="#fff" stroke="#2f7d55" stroke-width="1.6"/><text class="lbl" x="141.2" y="489.5">terminal success</text><rect x="232.4" y="480" width="12" height="12" rx="4" fill="#fff" stroke="#b3402f" stroke-width="1.6"/><text class="lbl" x="250.4" y="489.5">terminal failure</text><rect x="341.6" y="480" width="12" height="12" rx="4" fill="#fff" stroke="#6b6965" stroke-width="1.6"/><text class="lbl" x="359.6" y="489.5">dashed = conditional</text></svg>