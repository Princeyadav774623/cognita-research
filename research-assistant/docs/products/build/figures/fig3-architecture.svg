<svg width="860" height="400" viewBox="0 0 860 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three-tier architecture diagram"><rect width="100%" height="100%" fill="#ffffff"/>
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M0,0 L10,5 L0,10 z" fill="#7c7566"/>
          </marker>
        </defs>
        <style>
          .box{fill:#fff;stroke:#ddd6c8;stroke-width:1.5;rx:8}
          .band{fill:#faf7f1;stroke:#eae4d8;stroke-width:1;rx:10}
          .t{font-family:'Plus Jakarta Sans',sans-serif;font-size:12px;fill:#16150f;font-weight:600}
          .s{font-family:'JetBrains Mono',monospace;font-size:9.5px;fill:#7c7566}
          .lbl{font-family:'JetBrains Mono',monospace;font-size:9px;fill:#a06b21;letter-spacing:.08em}
          .ln{stroke:#7c7566;stroke-width:1.4;fill:none;marker-end:url(#ar)}
          .ln2{stroke:#1d5f63;stroke-width:1.4;fill:none;stroke-dasharray:4 3;marker-end:url(#ar)}
        </style>

        <rect class="band" x="10" y="10" width="250" height="380"/>
        <text class="lbl" x="24" y="32">PRESENTATION</text>
        <rect class="box" x="30" y="48" width="210" height="52"/>
        <text class="t" x="44" y="70">React SPA</text><text class="s" x="44" y="86">Vite · TypeScript · 31 tests</text>
        <rect class="box" x="30" y="114" width="210" height="46"/>
        <text class="t" x="44" y="134">Deep Research view</text><text class="s" x="44" y="149">live agent graph, report</text>
        <rect class="box" x="30" y="174" width="210" height="46"/>
        <text class="t" x="44" y="194">Chat with Files view</text><text class="s" x="44" y="209">upload, grounded chat</text>
        <rect class="box" x="30" y="234" width="210" height="46"/>
        <text class="t" x="44" y="254">Supabase auth client</text><text class="s" x="44" y="269">JWT in browser session</text>

        <rect class="band" x="300" y="10" width="270" height="380"/>
        <text class="lbl" x="314" y="32">APPLICATION</text>
        <rect class="box" x="320" y="48" width="230" height="52"/>
        <text class="t" x="334" y="70">FastAPI service</text><text class="s" x="334" y="86">REST + WebSocket · 165 tests</text>
        <rect class="box" x="320" y="114" width="230" height="46"/>
        <text class="t" x="334" y="134">LangGraph state machine</text><text class="s" x="334" y="149">9 nodes, reflective loop</text>
        <rect class="box" x="320" y="174" width="230" height="46"/>
        <text class="t" x="334" y="194">RAG subsystem</text><text class="s" x="334" y="209">hybrid retrieval + judge</text>
        <rect class="box" x="320" y="234" width="230" height="46"/>
        <text class="t" x="334" y="254">Auth · quota · rate limit</text><text class="s" x="334" y="269">JWKS verify, plan enforcement</text>
        <rect class="box" x="320" y="294" width="230" height="46"/>
        <text class="t" x="334" y="314">Local embeddings</text><text class="s" x="334" y="329">bge-small-en-v1.5, 384-dim</text>

        <rect class="band" x="610" y="10" width="240" height="380"/>
        <text class="lbl" x="624" y="32">DATA &amp; EXTERNAL</text>
        <rect class="box" x="630" y="48" width="200" height="60"/>
        <text class="t" x="644" y="70">PostgreSQL 16</text><text class="s" x="644" y="86">pgvector · HNSW · tsvector</text><text class="s" x="644" y="99">RLS on all 6 tables</text>
        <rect class="box" x="630" y="124" width="200" height="46"/>
        <text class="t" x="644" y="144">Groq inference</text><text class="s" x="644" y="159">gpt-oss-120b / 20b</text>
        <rect class="box" x="630" y="184" width="200" height="46"/>
        <text class="t" x="644" y="204">Tavily search</text><text class="s" x="644" y="219">web results + figures</text>
        <rect class="box" x="630" y="244" width="200" height="46"/>
        <text class="t" x="644" y="264">Supabase</text><text class="s" x="644" y="279">identity, public JWKS</text>
        <rect class="box" x="630" y="304" width="200" height="46"/>
        <text class="t" x="644" y="324">Cohere (optional)</text><text class="s" x="644" y="339">cross-encoder rerank</text>

        <path class="ln" d="M240 74 L318 74"/>
        <path class="ln2" d="M240 137 C280 137, 280 137, 318 137"/>
        <path class="ln" d="M550 74 L628 74"/>
        <path class="ln" d="M550 137 L628 147"/>
        <path class="ln" d="M550 197 L628 197"/>
        <path class="ln" d="M550 257 L628 267"/>
        <text class="lbl" x="252" y="66">REST</text>
        <text class="lbl" x="248" y="131">WS</text>
      </svg>