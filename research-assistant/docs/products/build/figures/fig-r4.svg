="18" fill="#fdf6f3" stroke="#a94b2f" stroke-width="1.4" filter="url(#lift)"/><text class="ttl" x="460" y="362">Consume monthly quota</text><path class="ln" d="M112,140 L300,76"/><path class="ln" d="M112,140 L300,124"/><path class="ln" d="M112,140 L300,172"/><path class="ln" d="M112,140 L300,220"/><path class="ln" d="M112,140 L300,268"/><path class="ln" d="M112,140 L300,316"/><path class="ln" d="M112,306 L302,316"/><path class="lnp" d="M792,208 L709.0,208.0 Q700,208 700.0,217.0 L700.0,349.0 Q700,358 691.0,358.0 L620,358"/><rect x="196" y="393.5" width="379" height="12.5" rx="3" fill="#fbfaf7" fill-opacity=".88"/><text class="note" x="200" y="402.0" fill="#6b6965">Uploading a document is NOT a use case of this product — that belongs to</text><rect x="196" y="407.0" width="379" height="12.5" rx="3" fill="#fbfaf7" fill-opacity=".88"/><text class="note" x="200" y="415.5" fill="#6b6965">Chat with Files. The corpus node reads what that product already stored.</text></svg>