<svg viewBox="0 0 880 400" width="880" height="400" xmlns="http://www.w3.org/2000/svg" role="img">
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#7c7566"/></marker>
  <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#a06b21"/></marker>
  <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#1d5f63"/></marker>
  <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#6b3352"/></marker>
  <marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L10,5 L0,10" fill="none" stroke="#7c7566" stroke-width="1.4"/></marker>
</defs>
<style>
  .t  { font-family:'Plus Jakarta Sans',sans-serif; font-size:11.5px; fill:#16150f; font-weight:600 }
  .tc { font-family:'Plus Jakarta Sans',sans-serif; font-size:11.5px; fill:#16150f; font-weight:600; text-anchor:middle }
  .s  { font-family:'JetBrains Mono',monospace; font-size:9px; fill:#7c7566 }
  .sc { font-family:'JetBrains Mono',monospace; font-size:9px; fill:#7c7566; text-anchor:middle }
  .lb { font-family:'JetBrains Mono',monospace; font-size:8.5px; fill:#7c7566 }
  .lbc{ font-family:'JetBrains Mono',monospace; font-size:8.5px; fill:#7c7566; text-anchor:middle }
  .cap{ font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:.1em; text-anchor:middle }
  .ln { stroke:#7c7566; stroke-width:1.3; fill:none; marker-end:url(#a) }
  .lnb{ stroke:#a06b21; stroke-width:1.4; fill:none; marker-end:url(#ab) }
  .lnt{ stroke:#1d5f63; stroke-width:1.4; fill:none; marker-end:url(#at) }
  .lnp{ stroke:#6b3352; stroke-width:1.4; fill:none; marker-end:url(#ap) }
  .dash{ stroke-dasharray:4 3 }
  .proc{ fill:#fff; stroke:#a06b21; stroke-width:1.6 }
  .store{ fill:#f7f4ed; stroke:#1d5f63; stroke-width:1.5 }
  .ext { fill:#faf6f8; stroke:#6b3352; stroke-width:1.5 }
  .band{ fill:#faf7f1; stroke:#ddd6c8; stroke-width:1 }
  .ok  { fill:#eef5f1; stroke:#1f6b4a; stroke-width:1.6 }
  .bad { fill:#fbf0ef; stroke:#9c2f26; stroke-width:1.6 }
</style><rect width="880" height="400" fill="#ffffff"/><g stroke="#a06b21" stroke-width="1.6" fill="none"><circle cx="72" cy="176" r="7"/><path d="M72,183 v16 M62,189 h20 M72,199 l-8,11 M72,199 l8,11"/></g><text class="tc" x="72" y="224">Document owner</text><rect class="band" x="200" y="110" width="300" height="150" rx="14"/><text class="cap" x="350.0" y="130" fill="#a06b21">CHAT WITH FILES</text><rect class="proc" x="232" y="148" width="236" height="82" rx="10"/><text class="tc" x="350.0" y="186.0">Cognita</text><text class="sc" x="350.0" y="200.0">ingest · retrieve · answer</text><path class="ext" d="M612,44 L830,44 L818,98 L600,98 z"/><text class="tc" x="715.0" y="68.0">Groq inference</text><text class="sc" x="715.0" y="82.0">answering, grading, judge</text><path class="ext" d="M612,128 L830,128 L818,182 L600,182 z"/><text class="tc" x="715.0" y="152.0">Supabase auth</text><text class="sc" x="715.0" y="166.0">JWT via public JWKS</text><path class="ext" d="M612,212 L830,212 L818,266 L600,266 z"/><text class="tc" x="715.0" y="236.0">Stripe</text><text class="sc" x="715.0" y="250.0">subscription state</text><path class="lnb" d="M148,170 L226,170"/><text class="lbc" x="187.0" y="162">upload a file</text><path class="lnb" d="M148,196 L226,196"/><text class="lbc" x="187.0" y="214">ask a question</text><path class="ln dash" d="M226,220 L190,220 L190,274 L100,274 L100,216"/><text class="lb" x="128" y="292" fill="#7c7566">answer with the passages it used — or a refusal</text><path class="lnp" d="M470,189 L596,71"/><path class="lnp" d="M470,189 L596,155"/><path class="lnp" d="M470,189 L596,239"/><path class="store" d="M232,299 a118.0,7 0 0,1 236,0 v42 a118.0,7 0 0,1 -236,0 z"/><path d="M232,299 a118.0,7 0 0,0 236,0" fill="none" stroke="#1d5f63" stroke-width="1.5"/><text class="tc" x="350.0" y="322.0">Postgres + pgvector</text><text class="sc" x="350.0" y="336.0">documents, chunks, chats</text><path class="lnt" d="M350,230 L350,290"/><text class="lb" x="524" y="292" fill="#7c7566">Embeddings are computed on the application</text><text class="lb" x="524" y="305" fill="#7c7566">node, not by a provider — no vector data</text><text class="lb" x="524" y="318" fill="#7c7566">leaves the deployment.</text><rect x="200" y="372" width="11" height="11" rx="3" fill="#fff" stroke="#a06b21" stroke-width="1.6"/><text class="lb" x="217" y="381">this product</text><rect x="286.8" y="372" width="11" height="11" rx="3" fill="#fff" stroke="#6b3352" stroke-width="1.6"/><text class="lb" x="303.8" y="381">outside the boundary</text><rect x="416.8" y="372" width="11" height="11" rx="3" fill="#fff" stroke="#1d5f63" stroke-width="1.6"/><text class="lb" x="433.8" y="381">data at rest</text></svg>