<svg viewBox="0 0 880 400" width="880" height="400" xmlns="http://www.w3.org/2000/svg" role="img"><rect width="880" height="400" fill="#fbfaf7"/><defs><marker id="ar-n" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#6b6965"/></marker><marker id="ar-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#a94b2f"/></marker><marker id="ar-t" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#1d5f63"/></marker><marker id="ar-p" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#6b3352"/></marker><marker id="ar-g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#2f7d55"/></marker><marker id="ar-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#b3402f"/></marker>
<filter id="card" x="-25%" y="-25%" width="150%" height="170%">
  <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#3c3226" flood-opacity="0.13"/>
</filter>
<filter id="lift" x="-25%" y="-25%" width="150%" height="170%">
  <feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#3c3226" flood-opacity="0.10"/>
</filter>
</defs>
<style>
 .ttl { font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif; font-size:12px; font-weight:700; fill:#141413;
        letter-spacing:-.01em; text-anchor:middle }
 .sub { font-family:'JetBrains Mono',Menlo,Consolas,monospace; font-size:8.2px; fill:#6b6965; text-anchor:middle }
 .lbl { font-family:'JetBrains Mono',Menlo,Consolas,monospace; font-size:8.4px; fill:#4d4c48 }
 .lblc{ font-family:'JetBrains Mono',Menlo,Consolas,monospace; font-size:8.4px; fill:#4d4c48; text-anchor:middle }
 .eyb { font-family:'JetBrains Mono',Menlo,Consolas,monospace; font-size:8.6px; font-weight:600; letter-spacing:.14em }
 .idx { font-family:'JetBrains Mono',Menlo,Consolas,monospace; font-size:8px; font-weight:600; text-anchor:middle }
 .note{ font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif; font-size:9.4px; fill:#6b6965 }
 .ln  { fill:none; stroke:#6b6965; stroke-width:1.25; stroke-linecap:round;
        marker-end:url(#ar-n) }
 .lna { fill:none; stroke:#a94b2f; stroke-width:1.5; stroke-linecap:round;
        marker-end:url(#ar-a) }
 .lnt { fill:none; stroke:#1d5f63; stroke-width:1.4; stroke-linecap:round;
        marker-end:url(#ar-t) }
 .lnp { fill:none; stroke:#6b3352; stroke-width:1.4; stroke-linecap:round;
        marker-end:url(#ar-p) }
 .dash{ stroke-dasharray:5 4; stroke-opacity:.85 }
</style><g stroke="#a94b2f" stroke-width="1.7" fill="none" stroke-linecap="round"><circle cx="72" cy="176" r="7.5"/><path d="M72,184 v15 M62,189 h20 M72,199 l-8,11 M72,199 l8,11"/></g><text class="ttl" x="72" y="225">Document owner</text><rect x="200" y="110" width="300" height="150" rx="18" fill="#f4f1e9" stroke="#ddd8cc" stroke-width="1.1"/><text class="eyb" x="350.0" y="131" text-anchor="middle" fill="#a94b2f">CHAT WITH FILES</text><rect x="232" y="148" width="236" height="82" rx="10" fill="#fdf6f3" stroke="#a94b2f" stroke-width="1.5" filter="url(#card)"/><text class="ttl" x="350.0" y="187.0">Cognita</text><text class="sub" x="350.0" y="202.0">ingest · retrieve · answer</text><path d="M612,44 L830,44 L818,98 L600,98 z" fill="#f9f2f6" stroke="#6b3352" stroke-width="1.4" filter="url(#card)"/><text class="ttl" x="715.0" y="69.0">Groq inference</text><text class="sub" x="715.0" y="84.0">answering, grading, judge</text><path d="M612,128 L830,128 L818,182 L600,182 z" fill="#f9f2f6" stroke="#6b3352" stroke-width="1.4" filter="url(#card)"/><text class="ttl" x="715.0" y="153.0">Supabase auth</text><text class="sub" x="715.0" y="168.0">JWT via public JWKS</text><path d="M612,212 L830,212 L818,266 L600,266 z" fill="#f9f2f6" stroke="#6b3352" stroke-width="1.4" filter="url(#card)"/><text class="ttl" x="715.0" y="237.0">Stripe</text><text class="sub" x="715.0" y="252.0">subscription state</text><path class="lna" d="M148,170 L226,170"/><rect x="149.24" y="153.5" width="75.52" height="13" rx="4" fill="#fbfaf7" fill-opacity=".95"/><text class="lblc" x="187.0" y="162">upload a file</text><path class="lna" d="M148,196 L226,196"/><rect x="146.72" y="205.5" width="80.56" height="13" rx="4" fill="#fbfaf7" fill-opacity=".95"/><text class="lblc" x="187.0" y="214">ask a question</text><path class="ln dash" d="M300,232 L300.0,259.0 Q300,268 291.0,268.0 L23.0,268.0 Q14,268 14.0,259.0 L14.0,199.0 Q14,190 23.0,190.0 L56,190"/><rect x="55.08" y="253.5" width="241.84" height="13" rx="4" fill="#fbfaf7" fill-opacity=".95"/><text class="lblc" x="176" y="262">answer with the passages it used, or a refusal</text><path class="lnp" d="M470,189 L596,71"/><path class="lnp" d="M470,189 L596,155"/><path class="lnp" d="M470,189 L596,239"/><g filter="url(#card)"><path d="M232,299 a118.0,7 0 0,1 236,0 v42 a118.0,7 0 0,1 -236,0 z" fill="#eef4f4" stroke="#1d5f63" stroke-width="1.4"/><path d="M232,299 a118.0,7 0 0,0 236,0" fill="none" stroke="#1d5f63" stroke-width="1.4"/></g><text class="ttl" x="350.0" y="318.0">Postgres + pgvector</text><text class="sub" x="350.0" y="333.0">documents, chunks, chats</text><path class="lnt" d="M350,230 L350,290"/><rect x="520" y="283.5" width="224" height="12.5" rx="3" fill="#fbfaf7" fill-opacity=".88"/><text class="note" x="524" y="292.0" fill="#6b6965">Embeddings are computed on the application</text><rect x="520" y="297.0" width="214" height="12.5" rx="3" fill="#fbfaf7" fill-opacity=".88"/><text class="note" x="524" y="305.5" fill="#6b6965">node, not by a provider — no vector data</text><rect x="520" y="310.5" width="121" height="12.5" rx="3" fill="#fbfaf7" fill-opacity=".88"/><text class="note" x="524" y="319.0" fill="#6b6965">leaves the deployment.</text><rect x="200" y="372" width="12" height="12" rx="4" fill="#fff" stroke="#a94b2f" stroke-width="1.6"/><text class="lbl" x="218" y="381.5">this product</text><rect x="288.4" y="372" width="12" height="12" rx="4" fill="#fff" stroke="#6b3352" stroke-width="1.6"/><text class="lbl" x="306.4" y="381.5">outside the boundary</text><rect x="418.4" y="372" width="12" height="12" rx="4" fill="#fff" stroke="#1d5f63" stroke-width="1.6"/><text class="lbl" x="436.4" y="381.5">data at rest</text></svg>