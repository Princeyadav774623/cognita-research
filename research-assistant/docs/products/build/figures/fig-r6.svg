<svg viewBox="0 0 880 452" width="880" height="452" xmlns="http://www.w3.org/2000/svg" role="img"><rect width="880" height="452" fill="#fbfaf7"/><defs><marker id="ar-n" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#6b6965"/></marker><marker id="ar-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#a94b2f"/></marker><marker id="ar-t" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#1d5f63"/></marker><marker id="ar-p" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#6b3352"/></marker><marker id="ar-g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#2f7d55"/></marker><marker id="ar-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#b3402f"/></marker>
<filter id="card" x="-25%" y="-25%" width="150%" height="170%">
  <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#3c3226" flood-opacity="0.13"/>
</filter>
<filter id="lift" x="-25%" y="-25%" width="150%" height="170%">
  <feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#3c3226" flood-opacity="0.10"/>
</filter>
</defs>
<style>
 .ttl { font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif; font-size:12px; font-weight:700; fill:#141413;
        letter-spacing:-.01em; text-anchor:middle }
 .sub { font-family:'JetBrains Mono',Menlo,Consolas,monospace; font-size:8.2px; fill:#6b6965; text-anchor:middle }
 .lbl { font-family:'JetBrains Mono',Menlo,Consolas,monospace; font-size:8.4px; fill:#4d4c48 }
 .lblc{ font-family:'JetBrains Mono',Menlo,Consolas,monospace; font-size:8.4px; fill:#4d4c48; text-anchor:middle }
 .eyb { font-family:'JetBrains Mono',Menlo,Consolas,monospace; font-size:8.6px; font-weight:600; letter-spacing:.14em }
 .idx { font-family:'JetBrains Mono',Menlo,Consolas,monospace; font-size:8px; font-weight:600; text-anchor:middle }
 .note{ font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif; font-size:9.4px; fill:#6b6965 }
 .ln  { fill:none; stroke:#6b6965; stroke-width:1.25; stroke-linecap:round;
        marker-end:url(#ar-n) }
 .lna { fill:none; stroke:#a94b2f; stroke-width:1.5; stroke-linecap:round;
        marker-end:url(#ar-a) }
 .lnt { fill:none; stroke:#1d5f63; stroke-width:1.4; stroke-linecap:round;
        marker-end:url(#ar-t) }
 .lnp { fill:none; stroke:#6b3352; stroke-width:1.4; stroke-linecap:round;
        marker-end:url(#ar-p) }
 .dash{ stroke-dasharray:5 4; stroke-opacity:.85 }
</style><path d="M52,52 L230,52 L218,104 L40,104 z" fill="#f9f2f6" stroke="#6b3352" stroke-width="1.4" filter="url(#card)"/><text class="ttl" x="135.0" y="76.0">Supabase identity</text><text class="sub" x="135.0" y="91.0">user_id comes from a JWT</text><rect x="300" y="44" width="250" height="235" rx="12" fill="#fbfaf7" stroke="#1d5f63" stroke-width="1.4" filter="url(#card)"/><path d="M301,74 h248" stroke="#1d5f63" stroke-width="1.1" opacity=".45"/><text class="ttl" x="425.0" y="64">research_sessions</text><text class="lbl" x="312" y="90">id</text><text class="lbl" x="538" y="90" text-anchor="end" fill="#a94b2f" font-weight="600">PK</text><text class="lbl" x="312" y="105">user_id</text><text class="lbl" x="538" y="105" text-anchor="end" fill="#a94b2f" font-weight="600">FK</text><text class="lbl" x="312" y="120">query</text><text class="lbl" x="312" y="135">status</text><text class="lbl" x="312" y="150">final_report</text><text class="lbl" x="312" y="165">sources  (JSON)</text><text class="lbl" x="312" y="180">images  (JSON)</text><text class="lbl" x="312" y="195">verified_claims  (JSON)</text><text class="lbl" x="312" y="210">confidence</text><text class="lbl" x="312" y="225">total_tokens</text><text class="lbl" x="312" y="240">estimated_cost_usd</text><text class="lbl" x="312" y="255">error</text><text class="lbl" x="312" y="270">created_at</text><rect x="620" y="44" width="230" height="145" rx="12" fill="#fbfaf7" stroke="#1d5f63" stroke-width="1.4" filter="url(#card)"/><path d="M621,74 h228" stroke="#1d5f63" stroke-width="1.1" opacity=".45"/><text class="ttl" x="735.0" y="64">user_subscriptions</text><text class="lbl" x="632" y="90">user_id</text><text class="lbl" x="838" y="90" text-anchor="end" fill="#a94b2f" font-weight="600">PK</text><text class="lbl" x="632" y="105">stripe_customer_id</text><text class="lbl" x="838" y="105" text-anchor="end" fill="#a94b2f" font-weight="600">FK</text><text class="lbl" x="632" y="120">stripe_subscription_id</text><text class="lbl" x="838" y="120" text-anchor="end" fill="#a94b2f" font-weight="600">FK</text><text class="lbl" x="632" y="135">plan_tier</text><text class="lbl" x="632" y="150">status</text><text class="lbl" x="632" y="165">monthly_queries_used</text><text class="lbl" x="632" y="180">usage_period_start</text><path class="lnt" d="M230,78 L264.0,78.0 Q265,78 265.0,79.0 L265.0,79.0 Q265,80 266.0,80.0 L296,80"/><text class="note" x="238" y="66.0" fill="#1d5f63">1 : N</text><path class="lnt" d="M230,66 L256.0,66.0 Q265,66 265.0,57.0 L265.0,31.0 Q265,22 274.0,22.0 L726.0,22.0 Q735,22 735.0,31.0 L735,40"/><text class="note" x="486" y="16.0" fill="#1d5f63">1 : 1</text><text class="note" x="40" y="150.0" fill="#6b6965">No local users table.</text><text class="note" x="40" y="163.5" fill="#6b6965">user_id is the Supabase</text><text class="note" x="40" y="177.0" fill="#6b6965">subject claim, verified</text><text class="note" x="40" y="190.5" fill="#6b6965">against a public JWKS</text><text class="note" x="40" y="204.0" fill="#6b6965">endpoint. Nothing in this</text><text class="note" x="40" y="217.5" fill="#6b6965">database owns identity.</text><text class="note" x="300" y="309.0" fill="#6b6965">sources, images and verified_claims are JSON columns on the session row rather than</text><text class="note" x="300" y="322.5" fill="#6b6965">tables of their own. They are written once when the run finishes and are never queried</text><text class="note" x="300" y="336.0" fill="#6b6965">across runs, so normalising them would buy joins nobody performs.</text><text class="note" x="300" y="349.5" fill="#6b6965"></text><text class="note" x="300" y="363.0" fill="#6b6965">Both tables carry a row-level security policy keyed on app.current_user_id, and</text><text class="note" x="300" y="376.5" fill="#6b6965">current_setting(..., true) returns NULL when it is unset — so a connection with no</text><text class="note" x="300" y="390.0" fill="#6b6965">tenant set matches zero rows rather than every row.</text><rect x="300" y="424" width="12" height="12" rx="4" fill="#fff" stroke="#1d5f63" stroke-width="1.6"/><text class="lbl" x="318" y="433.5">entity and relationship</text><rect x="445.6" y="424" width="12" height="12" rx="4" fill="#fff" stroke="#a94b2f" stroke-width="1.6"/><text class="lbl" x="463.6" y="433.5">key column</text><rect x="523.6" y="424" width="12" height="12" rx="4" fill="#fff" stroke="#6b3352" stroke-width="1.6"/><text class="lbl" x="541.6" y="433.5">outside the boundary</text></svg>