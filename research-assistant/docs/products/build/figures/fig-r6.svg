" stroke-width="1.2" opacity=".5"/><text class="tc" x="755.0" y="62">sources</text><text class="lb" x="670" y="86">url</text><text class="lb" x="670" y="101">title</text><text class="lb" x="670" y="116">snippet_only</text><text class="lb" x="670" y="131">read_ok</text><rect x="660" y="200" width="190" height="79" rx="7" fill="#fff" stroke="#1d5f63" stroke-width="1.5"/><path d="M660,226 h190" stroke="#1d5f63" stroke-width="1.2" opacity=".5"/><text class="tc" x="755.0" y="218">claims</text><text class="lb" x="670" y="242">text</text><text class="lb" x="670" y="257">verdict</text><text class="lb" x="670" y="272">corroborated</text><path class="lnt" d="M250,80 L326,80"/><text class="lb" x="268" y="72" fill="#1d5f63">1 : N</text><path class="lnt" d="M145,123 L145,226"/><text class="lb" x="152" y="176" fill="#1d5f63">1 : 1</text><path class="lnt" d="M580,92 L656,92"/><text class="lb" x="596" y="84" fill="#1d5f63">1 : N</text><path class="lnt" d="M580,140 L620,140 L620,240 L656,240"/><text class="lb" x="626" y="190" fill="#1d5f63">1 : N</text><text class="lb" x="330" y="320" fill="#7c7566">sources and claims are stored inside the session's JSON report payload rather</text><text class="lb" x="330" y="333" fill="#7c7566">than as tables of their own — they are written once with the run and never</text><text class="lb" x="330" y="346" fill="#7c7566">queried across runs.</text><text class="lb" x="330" y="359" fill="#7c7566"></text><text class="lb" x="330" y="372" fill="#7c7566">Every table above carries a row-level security policy keyed on</text><text class="lb" x="330" y="385" fill="#7c7566">app.current_user_id; a connection with no tenant set matches zero rows.</text><rect x="40" y="424" width="11" height="11" rx="3" fill="#fff" stroke="#1d5f63" stroke-width="1.6"/><text class="lb" x="57" y="433">entity and relationship</text><rect x="186.2" y="424" width="11" height="11" rx="3" fill="#fff" stroke="#a06b21" stroke-width="1.6"/><text class="lb" x="203.2" y="433">key column</text></svg>