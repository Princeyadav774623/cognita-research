<svg viewBox="0 0 880 452" width="880" height="452" xmlns="http://www.w3.org/2000/svg" role="img">
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#7c7566"/></marker>
  <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#a06b21"/></marker>
  <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#1d5f63"/></marker>
  <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#6b3352"/></marker>
  <marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L10,5 L0,10" fill="none" stroke="#7c7566" stroke-width="1.4"/></marker>
</defs>
<style>
  .t  { font-family:'Plus Jakarta Sans',sans-serif; font-size:11.5px; fill:#16150f; font-weight:600 }
  .tc { font-family:'Plus Jakarta Sans',sans-serif; font-size:11.5px; fill:#16150f; font-weight:600; text-anchor:middle }
  .s  { font-family:'JetBrains Mono',monospace; font-size:9px; fill:#7c7566 }
  .sc { font-family:'JetBrains Mono',monospace; font-size:9px; fill:#7c7566; text-anchor:middle }
  .lb { font-family:'JetBrains Mono',monospace; font-size:8.5px; fill:#7c7566 }
  .lbc{ font-family:'JetBrains Mono',monospace; font-size:8.5px; fill:#7c7566; text-anchor:middle }
  .cap{ font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:.1em; text-anchor:middle }
  .ln { stroke:#7c7566; stroke-width:1.3; fill:none; marker-end:url(#a) }
  .lnb{ stroke:#a06b21; stroke-width:1.4; fill:none; marker-end:url(#ab) }
  .lnt{ stroke:#1d5f63; stroke-width:1.4; fill:none; marker-end:url(#at) }
  .lnp{ stroke:#6b3352; stroke-width:1.4; fill:none; marker-end:url(#ap) }
  .dash{ stroke-dasharray:4 3 }
  .proc{ fill:#fff; stroke:#a06b21; stroke-width:1.6 }
  .store{ fill:#f7f4ed; stroke:#1d5f63; stroke-width:1.5 }
  .ext { fill:#faf6f8; stroke:#6b3352; stroke-width:1.5 }
  .band{ fill:#faf7f1; stroke:#ddd6c8; stroke-width:1 }
  .ok  { fill:#eef5f1; stroke:#1f6b4a; stroke-width:1.6 }
  .bad { fill:#fbf0ef; stroke:#9c2f26; stroke-width:1.6 }
</style><rect width="880" height="452" fill="#ffffff"/><path class="ext" d="M52,52 L230,52 L218,104 L40,104 z"/><text class="tc" x="135.0" y="75.0">Supabase identity</text><text class="sc" x="135.0" y="89.0">user_id comes from a JWT</text><rect x="300" y="44" width="250" height="229" rx="7" fill="#fff" stroke="#1d5f63" stroke-width="1.5"/><path d="M300,70 h250" stroke="#1d5f63" stroke-width="1.2" opacity=".5"/><text class="tc" x="425.0" y="62">research_sessions</text><text class="lb" x="310" y="86">id</text><text class="lb" x="540" y="86" text-anchor="end" fill="#a06b21">PK</text><text class="lb" x="310" y="101">user_id</text><text class="lb" x="540" y="101" text-anchor="end" fill="#a06b21">FK</text><text class="lb" x="310" y="116">query</text><text class="lb" x="310" y="131">status</text><text class="lb" x="310" y="146">final_report</text><text class="lb" x="310" y="161">sources  (JSON)</text><text class="lb" x="310" y="176">images  (JSON)</text><text class="lb" x="310" y="191">verified_claims  (JSON)</text><text class="lb" x="310" y="206">confidence</text><text class="lb" x="310" y="221">total_tokens</text><text class="lb" x="310" y="236">estimated_cost_usd</text><text class="lb" x="310" y="251">error</text><text class="lb" x="310" y="266">created_at</text><rect x="620" y="44" width="230" height="139" rx="7" fill="#fff" stroke="#1d5f63" stroke-width="1.5"/><path d="M620,70 h230" stroke="#1d5f63" stroke-width="1.2" opacity=".5"/><text class="tc" x="735.0" y="62">user_subscriptions</text><text class="lb" x="630" y="86">user_id</text><text class="lb" x="840" y="86" text-anchor="end" fill="#a06b21">PK</text><text class="lb" x="630" y="101">stripe_customer_id</text><text class="lb" x="840" y="101" text-anchor="end" fill="#a06b21">FK</text><text class="lb" x="630" y="116">stripe_subscription_id</text><text class="lb" x="840" y="116" text-anchor="end" fill="#a06b21">FK</text><text class="lb" x="630" y="131">plan_tier</text><text class="lb" x="630" y="146">status</text><text class="lb" x="630" y="161">monthly_queries_used</text><text class="lb" x="630" y="176">usage_period_start</text><path class="lnt" d="M230,78 L265,78 L265,80 L296,80"/><text class="lb" x="238" y="66" fill="#1d5f63">1 : N</text><path class="lnt" d="M230,66 L265,66 L265,22 L735,22 L735,40"/><text class="lb" x="486" y="16" fill="#1d5f63">1 : 1</text><text class="lb" x="40" y="150" fill="#7c7566">No local users table.</text><text class="lb" x="40" y="163" fill="#7c7566">user_id is the Supabase</text><text class="lb" x="40" y="176" fill="#7c7566">subject claim, verified</text><text class="lb" x="40" y="189" fill="#7c7566">against a public JWKS</text><text class="lb" x="40" y="202" fill="#7c7566">endpoint. Nothing in this</text><text class="lb" x="40" y="215" fill="#7c7566">database owns identity.</text><text class="lb" x="300" y="303" fill="#7c7566">sources, images and verified_claims are JSON columns on the session row rather than</text><text class="lb" x="300" y="316" fill="#7c7566">tables of their own. They are written once when the run finishes and are never queried</text><text class="lb" x="300" y="329" fill="#7c7566">across runs, so normalising them would buy joins nobody performs.</text><text class="lb" x="300" y="342" fill="#7c7566"></text><text class="lb" x="300" y="355" fill="#7c7566">Both tables carry a row-level security policy keyed on app.current_user_id, and</text><text class="lb" x="300" y="368" fill="#7c7566">current_setting(..., true) returns NULL when it is unset — so a connection with no</text><text class="lb" x="300" y="381" fill="#7c7566">tenant set matches zero rows rather than every row.</text><rect x="300" y="424" width="11" height="11" rx="3" fill="#fff" stroke="#1d5f63" stroke-width="1.6"/><text class="lb" x="317" y="433">entity and relationship</text><rect x="446.2" y="424" width="11" height="11" rx="3" fill="#fff" stroke="#a06b21" stroke-width="1.6"/><text class="lb" x="463.2" y="433">key column</text><rect x="522.2" y="424" width="11" height="11" rx="3" fill="#fff" stroke="#6b3352" stroke-width="1.6"/><text class="lb" x="539.2" y="433">outside the boundary</text></svg>