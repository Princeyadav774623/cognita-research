</style><rect x="30" y="30" width="240" height="190" rx="18" fill="#f4f1e9" stroke="#ddd8cc" stroke-width="1.1"/><text class="eyb" x="46" y="51" fill="#a94b2f">CLIENT</text><rect x="56" y="66" width="188" height="54" rx="12" fill="#fdf6f3" stroke="#a94b2f" stroke-width="1.5" filter="url(#card)"/><text class="ttl" x="150.0" y="91.0">Browser</text><text class="sub" x="150.0" y="106.0">React 19 SPA</text><rect x="56" y="138" width="188" height="54" rx="12" fill="#fdf6f3" stroke="#a94b2f" stroke-width="1.5" filter="url(#card)"/><text class="ttl" x="150.0" y="163.0">Upload widget</text><text class="sub" x="150.0" y="178.0">progress polling</text><rect x="310" y="30" width="270" height="300" rx="18" fill="#f4f1e9" stroke="#ddd8cc" stroke-width="1.1"/><text class="eyb" x="326" y="51" fill="#a94b2f">APPLICATION NODE</text><rect x="336" y="66" width="218" height="54" rx="12" fill="#fdf6f3" stroke="#a94b2f" stroke-width="1.5" filter="url(#card)"/><text class="ttl" x="445.0" y="91.0">uvicorn / FastAPI</text><text class="sub" x="445.0" y="106.0">async workers</text><rect x="336" y="138" width="218" height="54" rx="12" fill="#fdf6f3" stroke="#a94b2f" stroke-width="1.5" filter="url(#card)"/><text class="ttl" x="445.0" y="163.0">fastembed</text><text class="sub" x="445.0" y="178.0">bge-small, in-process</text><rect x="336" y="210" width="218" height="54" rx="12" fill="#fdf6f3" stroke="#a94b2f" stroke-width="1.5" filter="url(#card)"/><text class="ttl" x="445.0" y="235.0">ingest task</text><text class="sub" x="445.0" y="250.0">background, same process</text><rect x="620" y="30" width="230" height="176" rx="18" fill="#f4f1e9" stroke="#ddd8cc" stroke-width="1.1"/><text class="eyb" x="636" y="51" fill="#a94b2f">DATA NODE</text><g filter="url(#card)"><path d="M646,73 a89.0,7 0 0,1 178,0 v48 a89.0,7 0 0,1 -178,0 z" fill="#eef4f4" stroke="#1d5f63" stroke-width="1.4"/><path d="M646,73 a89.0,7 0 0,0 178,0" fill="none" stroke="#1d5f63" stroke-width="1.4"/></g><text class="ttl" x="735.0" y="9