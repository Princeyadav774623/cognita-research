y=".88"/><text class="note" x="336" y="352.0" fill="#a8690d">ingestion shares the web process — the single</text><rect x="332" y="357.0" width="255" height="12.5" rx="3" fill="#fbfaf7" fill-opacity=".88"/><text class="note" x="336" y="365.5" fill="#a8690d">largest architectural compromise in this product</text></svg>