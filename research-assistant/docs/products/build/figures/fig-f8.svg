c" x="735.0" y="293.0">Groq</text><text class="sc" x="735.0" y="307.0">20B / 120B</text><path class="ext" d="M658,332 L824,332 L812,380 L646,380 z"/><text class="tc" x="735.0" y="353.0">Supabase</text><text class="sc" x="735.0" y="367.0">JWKS</text><path class="ln" d="M248,92 L332,92"/><text class="lbc" x="290.0" y="86.0">HTTPS</text><path class="ln" d="M248,164 L332,100"/><path class="lnt" d="M558,96 L642,96"/><text class="lbc" x="600.0" y="90.0">cognita_app role</text><path class="lnt" d="M558,236 L642,100"/><path class="lnp" d="M558,164 L642,296"/><text class="lb" x="336" y="290" fill="#7c7566">embedding runs here, so retrieval costs nothing</text><text class="lb" x="336" y="303" fill="#7c7566">and evaluating hundreds of questions is free</text><text class="lb" x="336" y="352" fill="#8a6314">ingestion shares the web process — the single</text><text class="lb" x="336" y="365" fill="#8a6314">largest architectural compromise in this product</text></svg>