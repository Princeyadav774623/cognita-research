</style><text class="eyb" x="30" y="24" fill="#6b6965">CHAT WITH FILES — TWO PATHS THROUGH THE SAME TIERS</text><rect x="24" y="40" width="832" height="96" rx="18" fill="#f4f1e9" stroke="#ddd8cc" stroke-width="1.1"/><text class="eyb" x="40" y="61" fill="#6b6965">PRESENTATION</text><rect x="56" y="68" width="208" height="52" rx="12" fill="#fdf6f3" stroke="#a94b2f" stroke-width="1.5" filter="url(#card)"/><text class="ttl" x="160.0" y="92.0">Upload widget</text><text class="sub" x="160.0" y="107.0">polls ingestion status</text><rect x="296" y="68" width="208" height="52" rx="12" fill="#fdf6f3" stroke="#a94b2f" stroke-width="1.5" filter="url(#card)"/><text class="ttl" x="400.0" y="92.0">Chat page</text><text class="sub" x="400.0" y="107.0">/#files</text><rect x="536" y="68" width="208" height="52" rx="12" fill="#fdf6f3" stroke="#a94b2f" stroke-width="1.5" filter="url(#card)"/><text class="ttl" x="640.0" y="92.0">Passage panel</text><text class="sub" x="640.0" y="107.0">what the answer used</text><g filter="url(#card)"><path d="M768,75 a32.0,7 0 0,1 64,0 v38 a32.0,7 0 0,1 -64,0 z" fill="#eef4f4" stroke="#1d5f63" stroke-width="1.4"/><path d="M768,75 a32.0,7 0 0,0 64,0" fill="none" stroke="#1d5f63" stroke-width="1.4"/></g><text class="ttl" x="800.0" y="98.0">chats</text><rect x="24" y="168" width="832" height="152" rx="18" fill="#f4f1e9" stroke="#ddd8cc" stroke-width="1.1"/><text class="eyb" x="40" y="189" fill="#6b6965">APPLICATION</text><rect x="56" y="196" width="208" height="52" rx="12" fill="#fdf6f3" stroke="#a94b2f" stroke-width="1.5" filter="url(#card)"/><text class="ttl" x="160.0" y="220.0">Ingest task</text><text class="sub" x="160.0" y="235.0">background, same process</text><rect x="296" y="196" width="208" height="52" rx="12" fill="#fdf6f3" stroke="#a94b2f" stroke-width="1.5" filter="url(#card)"/><text class="ttl" x="400.0" y="220.0">fastembed</text><text class="sub" x="400.0" y="235.0">bge-small, in-process</text><rect x="536" y="196" width="296" height="52" rx="12" fill="#fdf6f3" stroke="#a94b2f" stroke-width="1.5" filter="url(#card)"/><text class="ttl" x="684.0" y="220.0">Retrieval + RRF</text><text class="sub" x="684.0" y="235.0">two searches fused by rank, k = 60</text><rect x="56" y="262" width="448" height="46" rx="12" fill="#fdf6f3" stroke="#a94b2f" stroke-width="1.5" filter="url(#card)"/><text class="ttl" x="280.0" y="283.0">Grade · rewrite · retry · decline</text><text class="sub" x="280.0" y="298.0">the loop that decides not to answer</text><rect x="536" y="262" width="296" height="46" rx="12" fill="#fdf6f3" stroke="#a94b2f" stroke-width="1.5" filter="url(#card)"/><text class="ttl" x="684.0" y="283.0">LLM-as-a-Judge</text><text class="sub" x="684.0" y="298.0">faithfulness and relevance, separate model</text><rect x="24" y="352" width="496" height="96" rx="18" fill="#f4f1e9" stroke="#ddd8cc" stroke-width="1.1"/><text class="eyb" x="40" y="373" fill="#6b6965">PERSISTENCE</text><g filter="url(#card)"><path d="M56,389 a68.0,7 0 0,1 136,0 v36 a68.0,7 0 0,1 -136,0 z" fill="#eef4f4" stroke="#1d5f63" stroke-width="1.4"/><path d="M56,389 a68.0,7 0 0,0 136,0" fill="none" stroke="#1d5f63" stroke-width="1.4"/></g><text class="ttl" x="124.0" y="411.0">rag_documents</text><g filter="url(#card)"><path d="M212,389 a68.0,7 0 0,1 136,0 v36 a68.0,7 0 0,1 -136,0 z" fill="#eef4f4" stroke="#1d5f63" stroke-width="1.4"/><path d="M212,389 a68.0,7 0 0,0 136,0" fill="none" stroke="#1d5f63" stroke-width="1.4"/></g><text class="ttl" x="280.0" y="411.0">rag_chunks</text><rect x="368" y="382" width="128" height="50" rx="12" fill="#eef4f4" stroke="#1d5f63" stroke-width="1.4" filter="url(#card)"/><text class="ttl" x="432.0" y="405.0">HNSW + GIN</text><text class="sub" x="432.0" y="420.0">both halves indexed</text><rect x="552" y="352" width="304" height="96" rx="18" fill="#f4f1e9" stroke="#ddd8cc" stroke-width="1.1"/><text class="eyb" x="568" y="373" fill="#6b6965">EXTERNAL</text><path d="M592,380 L708,380 L696,432 L580,432 z" fill="#f9f2f6" stroke="#6b3352" stroke-width="1.4" filter="url(#card)"/><text class="ttl" x="644.0" y="404.0">Groq</text><text class="sub" x="644.0" y="419.0">20B / 120B</text><path d="M736,380 L840,380 L828,432 L724,432 z" fill="#f9f2f6" stroke="#6b3352" stroke-width="1.4" filter="url(#card)"/><text class="ttl" x="782.0" y="404.0">Supabase</text><text class="sub" x="782.0" y="419.0">JWKS</text><path class="lna" d="M160,120 L160,192"/><path class="lna" d="M400,120 L400,192"/><path class="lna" d="M264,222 L292,222"/><path class="lna" d="M504,222 L532,222"/><path class="lna" d="M160,248 L160,258"/><path class="lna" d="M684,248 L684,258"/><path class="lnt" d="M124,308 L124,378"/><path class="lnt" d="M280,308 L280,378"/><path class="lnp" d="M832,222 L841.0,222.0 Q850,222 850.0,231.0 L850.0,331.0 Q850,340 841.0,340.0 L653.0,340.0 Q644,340 644.0,349.0 L644,376"/><rect x="532" y="137.5" width="245" height="12.5" rx="3" fill="#fbfaf7" fill-opacity=".88"/><text class="note" x="536" y="146.0" fill="#6b6965">nothing leaves the deployment to be embedded —</text><rect x="532" y="151.0" width="188" height="12.5" rx="3" fill="#fbfaf7" fill-opacity=".88"/><text class="note" x="536" y="159.5" fill="#6b6965">which is what makes evaluation free</text><rect x="24" y="466" width="12" height="12" rx="4" fill="#fff" stroke="#a94b2f" stroke-width="1.6"/><text class="lbl" x="42" y="475.5">process</text><rect x="86.4" y="466" width="12" height="12" rx="4" fill="#fff" stroke="#1d5f63" stroke-width="1.6"/><text class="lbl" x="104.4" y="475.5">data at rest</text><rect x="174.8" y="466" width="12" height="12" rx="4" fill="#fff" stroke="#6b3352" stroke-width="1.6"/><text class="lbl" x="192.8" y="475.5">external service</text></svg>