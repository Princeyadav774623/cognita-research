<svg width="700" height="260" viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bar chart of confidence scores across five research runs"><rect width="100%" height="100%" fill="#ffffff"/>
        <style>
          .qq{font-family:'Plus Jakarta Sans',sans-serif;font-size:10.5px;fill:#474338}
          .vv{font-family:'JetBrains Mono',monospace;font-size:10.5px;fill:#16150f;font-weight:500}
          .tk{font-family:'JetBrains Mono',monospace;font-size:9px;fill:#7c7566}
          .grid{stroke:#eae4d8;stroke-width:1}
          .gl{font-family:'JetBrains Mono',monospace;font-size:8.5px;fill:#a89f8c}
