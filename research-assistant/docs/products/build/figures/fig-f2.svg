-width="1.6"/><text class="lbl" x="120.4" y="411.5">data store</text><rect x="180.4" y="402" width="12" height="12" rx="4" fill="#fff" stroke="#6b3352" stroke-width="1.6"/><text class="lbl" x="198.4" y="411.5">external entity</text><rect x="284.4" y="402" width="12" height="12" rx="4" fill="#fff" stroke="#6b6965" stroke-width="1.6"/><text class="lbl" x="302.4" y="411.5">dashed = conditional</text></svg>