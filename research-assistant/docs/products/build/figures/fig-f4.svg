</style><rect width="880" height="430" fill="#ffffff"/><g stroke="#a06b21" stroke-width="1.6" fill="none"><circle cx="76" cy="120" r="7"/><path d="M76,127 v16 M66,133 h20 M76,143 l-8,11 M76,143 l8,11"/></g><text class="tc" x="76" y="168">Document owner</text><g stroke="#a06b21" stroke-width="1.6" fill="none"><circle cx="76" cy="300" r="7"/><path d="M76,307 v16 M66,313 h20 M76,323 l-8,11 M76,323 l8,11"/></g><text class="tc" x="76" y="348">Guest (dev)</text><g stroke="#a06b21" stroke-width="1.6" fill="none"><circle cx="800" cy="200" r="7"/><path d="M800,207 v16 M790,213 h20 M800,223 l-8,11 M800,223 l8,11"/></g><text class="tc" x="800" y="248">Stripe</text><rect class="band" x="190" y="26" width="540" height="350" rx="14"/><text class="cap" x="460.0" y="46" fill="#a06b21">CHAT WITH FILES</text><ellipse class="proc" cx="460" cy="76" rx="168" ry="18"/><text class="tc" x="460" y="79">Upload PDF, DOCX, TXT, MD or image</text><ellipse class="proc" cx="460" cy="124" rx="168" ry="18"/><text class="tc" x="460" y="127">Watch ingestion progress</text><ellipse class="proc" cx="460" cy="172" rx="168" ry="18"/><text class="tc" x="460" y="175">Ask a question of the corpus</text><ellipse class="proc" cx="460" cy="220" rx="168" ry="18"/><text class="tc" x="460" y="223">See which passages were used</text><ellipse class="proc" cx="460" cy="268" rx="168" ry="18"/><text class="tc" x="460" y="271">Receive an honest refusal</text><ellipse class="proc" cx="460" cy="316" rx="168" ry="18"/><text class="tc" x="460" y="319">Delete a document and its chunks</text><ellipse class="proc" cx="460" cy="356" rx="168" ry="18"/><text class="tc" x="460" y="359">Consume monthly quota</text><path class="ln" d="M112,130 L290,76"/><path class="ln" d="M112,130 L290,124"/><path class="ln" d="M112,130 L290,172"/><path class="ln" d="M112,130 L290,220"/><path class="ln" d="M112,130 L290,268"/><path class="ln" d="M112,130 L290,316"/><path class="ln" d="M112,306 L292,316"/><path class="lnp" d="M792,208 L700,208 L700,356 L630,356"/><text class="lb" x="200" y="398" fill="#7c7566">Answering from the open web is NOT a use case of this product — that belongs to</text><text class="lb" x="200" y="411" fill="#7c7566">Deep Research. Everything here is bounded by what the user uploaded.</text></svg>