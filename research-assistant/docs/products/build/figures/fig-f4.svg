<style>
 .ttl { font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif; font-size:12px; font-weight:700; fill:#141413;
        letter-spacing:-.01em; text-anchor:middle }
 .sub { font-family:'JetBrains Mono',Menlo,Consolas,monospace; font-size:8.2px; fill:#6b6965; text-anchor:middle }
 .lbl { font-family:'JetBrains Mono',Menlo,Consolas,monospace; font-size:8.4px; fill:#4d4c48 }
 .lblc{ font-family:'JetBrains Mono',Menlo,Consolas,monospace; font-size:8.4px; fill:#4d4c48; text-anchor:middle }
 .eyb { font-family:'JetBrains Mono',Menlo,Consolas,monospace; font-size:8.6px; font-weight:600; letter-spacing:.14em }
 .idx { font-family:'JetBrains Mono',Menlo,Consolas,monospace; font-size:8px; font-weight:600; text-anchor:middle }
 .note{ font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif; font-size:9.4px; fill:#6b6965 }
 .ln  { fill:none; stroke:#6b6965; stroke-width:1.25; stroke-linecap:round;
        marker-end:url(#ar-n) }
 .lna { fill:none; stroke:#a94b2f; stroke-width:1.5; stroke-linecap:round;
        marker-end:url(#ar-a) }
 .lnt { fill:none; stroke:#1d5f63; stroke-width:1.4; stroke-linecap:round;
        marker-end:url(#ar-t) }
 .lnp { fill:none; stroke:#6b3352; stroke-width:1.4; stroke-linecap:round;
        marker-end:url(#ar-p) }
 .dash{ stroke-dasharray:5 4; stroke-opacity:.85 }
</style><g stroke="#a94b2f" stroke-width="1.7" fill="none" stroke-linecap="round"><circle cx="76" cy="120" r="7.5"/><path d="M76,128 v15 M66,133 h20 M76,143 l-8,11 M76,143 l8,11"/></g><text class="ttl" x="76" y="169">Document owner</text><g stroke="#a94b2f" stroke-width="1.7" fill="none" stroke-linecap="round"><circle cx="76" cy="300" r="7.5"/><path d="M76,308 v15 M66,313 h20 M76,323 l-8,11 M76,323 l8,11"/></g><text class="ttl" x="76" y="349">Guest (dev)</text><g stroke="#a94b2f" stroke-width="1.7" fill="none" stroke-linecap="round"><circle cx="800" cy="200" r="7.5"/><path d="M800,208 v15 M790,213 h20 M800,223 l-8,11 M800,223 l8,11"/></g><text class="ttl" x="800" y="249">Stripe</text><rect x="190" y="26" width="540" height="350" rx="18" fill="#f4f1e9" stroke="#ddd8cc" stroke-width="1.1"/><text class="eyb" x="460.0" y="47" text-anchor="middle" fill="#a94b2f">CHAT WITH FILES</text><ellipse cx="460" cy="76" rx="168" ry="18" fill="#fdf6f3" stroke="#a94b2f" stroke-width="1.4" filter="url(#lift)"/><text class="ttl" x="460" y="80">Upload PDF, DOCX, TXT, MD or image</text><ellipse cx="460" cy="124" rx="168" ry="18" fill="#fdf6f3" stroke="#a94b2f" stroke-width="1.4" filter="url(#lift)"/><text class="ttl" x="460" y="128">Watch ingestion progress</text><ellipse cx="460" cy="172" rx="168" ry="18" fill="#fdf6f3" stroke="#a94b2f" stroke-width="1.4" filter="url(#lift)"/><text class="ttl" x="460" y="176">Ask a question of the corpus</text><ellipse cx="460" cy="220" rx="168" ry="18" fill="#fdf6f3" stroke="#a94b2f" stroke-width="1.4" filter="url(#lift)"/><text class="ttl" x="460" y="224">See which passages were used</text><ellipse cx="460" cy="268" rx="168" ry="18" fill="#fdf6f3" stroke="#a94b2f" stroke-width="1.4" filter="url(#lift)"/><text class="ttl" x="460" y="272">Receive an honest refusal</text><ellipse cx="460" cy="316" rx="168" ry="18" fill="#fdf6f3" stroke="#a94b2f" stroke-width="1.4" filter="url(#lift)"/><text class="ttl" x="460" y="320">Delete a document and its chunks</text><ellipse cx="460" cy="356" rx="168" ry="18" fill="#fdf6f3" stroke="#a94b2f" stroke-width="1.4" filter="url(#lift)"/><text class="ttl" x="460" y="360">Consume monthly quota</text><path class="ln" d="M112,130 L290,76"/><path class="ln" d="M112,130 L290,124"/><path class="ln" d="M112,130 L290,172"/><path class="ln" d="M112,130 L290,220"/><path class="ln" d="M112,130 L290,268"/><path class="ln" d="M112,130 L290,316"/><path class="ln" d="M112,306 L292,316"/><path class="lnp" d="M792,208 L709.0,208.0 Q700,208 700.0,217.0 L700.0,347.0 Q700,356 691.0,356.0 L630,356"/><rect x="196" y="389.5" width="415" height="12.5" rx="3" fill="#fbfaf7" fill-opacity=".88"/><text class="note" x="200" y="398.0" fill="#6b6965">Answering from the open web is NOT a use case of this product — that belongs to</text><rect x="196" y="403.0" width="358" height="12.5" rx="3" fill="#fbfaf7" fill-opacity=".88"/><text class="note" x="200" y="411.5" fill="#6b6965">Deep Research. Everything here is bounded by what the user uploaded.</text></svg>