<svg viewBox="0 0 880 686" width="880" height="686" xmlns="http://www.w3.org/2000/svg" role="img"><rect width="880" height="686" fill="#fbfaf7"/><defs><marker id="ar-n" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#6b6965"/></marker><marker id="ar-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#a94b2f"/></marker><marker id="ar-t" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#1d5f63"/></marker><marker id="ar-p" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#6b3352"/></marker><marker id="ar-g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#2f7d55"/></marker><marker id="ar-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#b3402f"/></marker>
<filter id="card" x="-25%" y="-25%" width="150%" height="170%">
  <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#3c3226" flood-opacity="0.13"/>
</filter>
<filter id="lift" x="-25%" y="-25%" width="150%" height="170%">
  <feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#3c3226" flood-opacity="0.10"/>
</filter>
</defs>
<style>
 .ttl { font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif; font-size:12px; font-weight:700; fill:#141413;
        letter-spacing:-.01em; text-anchor:middle }
 .sub { font-family:'JetBrains Mono',Menlo,Consolas,monospace; font-size:8.2px; fill:#6b6965; text-anchor:middle }
 .lbl { font-family:'JetBrains Mono',Menlo,Consolas,monospace; font-size:8.4px; fill:#4d4c48 }
 .lblc{ font-family:'JetBrains Mono',Menlo,Consolas,monospace; font-size:8.4px; fill:#4d4c48; text-anchor:middle }
 .eyb { font-family:'JetBrains Mono',Menlo,Consolas,monospace; font-size:8.6px; font-weight:600; letter-spacing:.14em }
 .idx { font-family:'JetBrains Mono',Menlo,Consolas,monospace; font-size:8px; font-weight:600; text-anchor:middle }
 .note{ font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif; font-size:9.4px; fill:#6b6965 }
 .ln  { fill:none; stroke:#6b6965; stroke-width:1.25; stroke-linecap:round;
        marker-end:url(#ar-n) }
 .lna { fill:none; stroke:#a94b2f; stroke-width:1.5; stroke-linecap:round;
        marker-end:url(#ar-a) }
 .lnt { fill:none; stroke:#1d5f63; stroke-width:1.4; stroke-linecap:round;
        marker-end:url(#ar-t) }
 .lnp { fill:none; stroke:#6b3352; stroke-width:1.4; stroke-linecap:round;
        marker-end:url(#ar-p) }
 .dash{ stroke-dasharray:5 4; stroke-opacity:.85 }
</style><rect x="16.0" y="26" width="148" height="36" rx="12" fill="#fdf6f3" stroke="#a94b2f" stroke-width="1.5" filter="url(#card)"/><text class="ttl" x="90.0" y="48.0">Browser</text><path d="M90,62 L90,620" stroke="#ddd8cc" stroke-width="1.2" stroke-dasharray="3 5" fill="none"/><rect x="190.0" y="26" width="148" height="36" rx="12" fill="#fdf6f3" stroke="#a94b2f" stroke-width="1.5" filter="url(#card)"/><text class="ttl" x="264.0" y="48.0">FastAPI</text><path d="M264,62 L264,620" stroke="#ddd8cc" stroke-width="1.2" stroke-dasharray="3 5" fill="none"/><rect x="366.0" y="26" width="148" height="36" rx="12" fill="#fdf6f3" stroke="#a94b2f" stroke-width="1.5" filter="url(#card)"/><text class="ttl" x="440.0" y="48.0">Ingest / retrieval</text><path d="M440,62 L440,620" stroke="#ddd8cc" stroke-width="1.2" stroke-dasharray="3 5" fill="none"/><rect x="544.0" y="26" width="148" height="36" rx="12" fill="#f9f2f6" stroke="#6b3352" stroke-width="1.4" filter="url(#card)"/><text class="ttl" x="618.0" y="48.0">Groq</text><path d="M618,62 L618,620" stroke="#ddd8cc" stroke-width="1.2" stroke-dasharray="3 5" fill="none"/><rect x="716.0" y="26" width="148" height="36" rx="12" fill="#eef4f4" stroke="#1d5f63" stroke-width="1.4" filter="url(#card)"/><text class="ttl" x="790.0" y="48.0">Postgres</text><path d="M790,62 L790,620" stroke="#ddd8cc" stroke-width="1.2" stroke-dasharray="3 5" fill="none"/><text class="cap" x="120" y="102" fill="#a94b2f">UPLOAD</text><path class="ln" d="M96,126 L258,126"/><rect x="139.24" y="110.5" width="75.52" height="13" rx="4" fill="#fbfaf7" fill-opacity=".95"/><text class="lblc" x="177.0" y="119">POST the file</text><path class="lnt" d="M270,156 L784,156"/><rect x="443.88" y="140.5" width="166.24" height="13" rx="4" fill="#fbfaf7" fill-opacity=".95"/><text class="lblc" x="527.0" y="149">insert row, status = processing</text><path class="ln dash" d="M258,186 L96,186"/><rect x="86.32" y="170.5" width="181.36" height="13" rx="4" fill="#fbfaf7" fill-opacity=".95"/><text class="lblc" x="177.0" y="179">202 Accepted — request returns now</text><path class="lna" d="M270,216 L434,216"/><rect x="276.44" y="200.5" width="151.12" height="13" rx="4" fill="#fbfaf7" fill-opacity=".95"/><text class="lblc" x="352.0" y="209">hand off, out of the request</text><path class="ln" d="M446,246 L494.0,246.0 Q500,246 500.0,252.0 L500.0,260.0 Q500,266 494.0,266.0 L450,266"/><text class="lbl" x="509" y="260">extract, chunk, embed locally</text><path class="lnt" d="M446,290 L784,290"/><rect x="514.24" y="274.5" width="201.52" height="13" rx="4" fill="#fbfaf7" fill-opacity=".95"/><text class="lblc" x="615.0" y="283">write chunks + vectors, status = ready</text><path d="M24,326 L856,326" stroke="#ddd8cc" stroke-width="1.2"/><text class="cap" x="126" y="352" fill="#1d5f63">QUESTION</text><path class="ln" d="M96,374 L258,374"/><rect x="129.16" y="358.5" width="95.68" height="13" rx="4" fill="#fbfaf7" fill-opacity=".95"/><text class="lblc" x="177.0" y="367">POST the question</text><path class="lna" d="M270,404 L434,404"/><rect x="261.32" y="388.5" width="181.36" height="13" rx="4" fill="#fbfaf7" fill-opacity=".95"/><text class="lblc" x="352.0" y="397">contextualise against chat history</text><path class="lnt" d="M446,434 L784,434"/><rect x="534.4" y="418.5" width="161.2" height="13" rx="4" fill="#fbfaf7" fill-opacity=".95"/><text class="lblc" x="615.0" y="427">vector search + keyword search</text><path class="ln" d="M446,464 L494.0,464.0 Q500,464 500.0,470.0 L500.0,478.0 Q500,484 494.0,484.0 L450,484"/><text class="lbl" x="509" y="478">fuse the two rankings — RRF</text><path class="lnp" d="M446,508 L612,508"/><rect x="461.0" y="492.5" width="136.0" height="13" rx="4" fill="#fbfaf7" fill-opacity=".95"/><text class="lblc" x="529.0" y="501">grade the passages  (20B)</text><path class="lnp" d="M446,538 L612,538"/><rect x="443.36" y="522.5" width="171.28" height="13" rx="4" fill="#fbfaf7" fill-opacity=".95"/><text class="lblc" x="529.0" y="531">answer from the passages  (120B)</text><path class="lnt" d="M446,568 L784,568"/><rect x="569.68" y="552.5" width="90.64" height="13" rx="4" fill="#fbfaf7" fill-opacity=".95"/><text class="lblc" x="615.0" y="561">persist the turn</text><path class="ln" d="M258,598 L96,598"/><rect x="98.92" y="582.5" width="156.16" height="13" rx="4" fill="#fbfaf7" fill-opacity=".95"/><text class="lblc" x="177.0" y="591">answer + the passages it used</text><text class="note" x="24" y="650.0" fill="#6b6965">If grading fails, the question is rewritten once and retrieval runs again before the</text><text class="note" x="24" y="663.5" fill="#6b6965">system declines — that branch is drawn in full in Figure F.9.</text></svg>