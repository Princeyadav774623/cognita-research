<svg viewBox="0 0 880 686" width="880" height="686" xmlns="http://www.w3.org/2000/svg" role="img">
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#7c7566"/></marker>
  <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#a06b21"/></marker>
  <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#1d5f63"/></marker>
  <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#6b3352"/></marker>
  <marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L10,5 L0,10" fill="none" stroke="#7c7566" stroke-width="1.4"/></marker>
</defs>
<style>
  .t  { font-family:'Plus Jakarta Sans',sans-serif; font-size:11.5px; fill:#16150f; font-weight:600 }
  .tc { font-family:'Plus Jakarta Sans',sans-serif; font-size:11.5px; fill:#16150f; font-weight:600; text-anchor:middle }
  .s  { font-family:'JetBrains Mono',monospace; font-size:9px; fill:#7c7566 }
  .sc { font-family:'JetBrains Mono',monospace; font-size:9px; fill:#7c7566; text-anchor:middle }
  .lb { font-family:'JetBrains Mono',monospace; font-size:8.5px; fill:#7c7566 }
  .lbc{ font-family:'JetBrains Mono',monospace; font-size:8.5px; fill:#7c7566; text-anchor:middle }
  .cap{ font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:.1em; text-anchor:middle }
  .ln { stroke:#7c7566; stroke-width:1.3; fill:none; marker-end:url(#a) }
  .lnb{ stroke:#a06b21; stroke-width:1.4; fill:none; marker-end:url(#ab) }
  .lnt{ stroke:#1d5f63; stroke-width:1.4; fill:none; marker-end:url(#at) }
  .lnp{ stroke:#6b3352; stroke-width:1.4; fill:none; marker-end:url(#ap) }
  .dash{ stroke-dasharray:4 3 }
  .proc{ fill:#fff; stroke:#a06b21; stroke-width:1.6 }
  .store{ fill:#f7f4ed; stroke:#1d5f63; stroke-width:1.5 }
  .ext { fill:#faf6f8; stroke:#6b3352; stroke-width:1.5 }
  .band{ fill:#faf7f1; stroke:#ddd6c8; stroke-width:1 }
  .ok  { fill:#eef5f1; stroke:#1f6b4a; stroke-width:1.6 }
  .bad { fill:#fbf0ef; stroke:#9c2f26; stroke-width:1.6 }
</style><rect width="880" height="686" fill="#ffffff"/><rect class="proc" x="24.0" y="26" width="132" height="34" rx="8"/><text class="tc" x="90.0" y="45.0">Browser</text><path d="M90,60 L90,620" stroke="#7c7566" stroke-width="1" stroke-dasharray="3 4" fill="none"/><rect class="proc" x="198.0" y="26" width="132" height="34" rx="8"/><text class="tc" x="264.0" y="45.0">FastAPI</text><path d="M264,60 L264,620" stroke="#7c7566" stroke-width="1" stroke-dasharray="3 4" fill="none"/><rect class="proc" x="374.0" y="26" width="132" height="34" rx="8"/><text class="tc" x="440.0" y="45.0">Ingest / retrieval</text><path d="M440,60 L440,620" stroke="#7c7566" stroke-width="1" stroke-dasharray="3 4" fill="none"/><rect class="ext" x="552.0" y="26" width="132" height="34" rx="8"/><text class="tc" x="618.0" y="45.0">Groq</text><path d="M618,60 L618,620" stroke="#7c7566" stroke-width="1" stroke-dasharray="3 4" fill="none"/><rect class="store" x="724.0" y="26" width="132" height="34" rx="8"/><text class="tc" x="790.0" y="45.0">Postgres</text><path d="M790,60 L790,620" stroke="#7c7566" stroke-width="1" stroke-dasharray="3 4" fill="none"/><text class="cap" x="120" y="102" fill="#a06b21">UPLOAD</text><path class="ln" d="M96,126 L258,126"/><text class="lbc" x="177.0" y="120">POST the file</text><path class="lnt" d="M270,156 L784,156"/><text class="lbc" x="527.0" y="150">insert row, status = processing</text><path class="ln dash" d="M258,186 L96,186"/><text class="lbc" x="177.0" y="180">202 Accepted — request returns now</text><path class="lnb" d="M270,216 L434,216"/><text class="lbc" x="352.0" y="210">hand off, out of the request</text><path class="ln" d="M446,246 L500,246 L500,266 L450,266"/><text class="lb" x="508" y="260">extract, chunk, embed locally</text><path class="lnt" d="M446,290 L784,290"/><text class="lbc" x="615.0" y="284">write chunks + vectors, status = ready</text><path d="M24,326 L856,326" stroke="#ddd6c8" stroke-width="1.2"/><text class="cap" x="126" y="352" fill="#1d5f63">QUESTION</text><path class="ln" d="M96,374 L258,374"/><text class="lbc" x="177.0" y="368">POST the question</text><path class="lnb" d="M270,404 L434,404"/><text class="lbc" x="352.0" y="398">contextualise against chat history</text><path class="lnt" d="M446,434 L784,434"/><text class="lbc" x="615.0" y="428">vector search + keyword search</text><path class="ln" d="M446,464 L500,464 L500,484 L450,484"/><text class="lb" x="508" y="478">fuse the two rankings — RRF</text><path class="lnp" d="M446,508 L612,508"/><text class="lbc" x="529.0" y="502">grade the passages  (20B)</text><path class="lnp" d="M446,538 L612,538"/><text class="lbc" x="529.0" y="532">answer from the passages  (120B)</text><path class="lnt" d="M446,568 L784,568"/><text class="lbc" x="615.0" y="562">persist the turn</text><path class="ln" d="M258,598 L96,598"/><text class="lbc" x="177.0" y="592">answer + the passages it used</text><text class="lb" x="24" y="650" fill="#7c7566">If grading fails, the question is rewritten once and retrieval runs again before the</text><text class="lb" x="24" y="663" fill="#7c7566">system declines — that branch is drawn in full in Figure F.9.</text></svg>