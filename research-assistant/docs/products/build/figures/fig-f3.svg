</style><text x="24" y="26" font-family="JetBrains Mono,monospace" font-size="9" letter-spacing=".1em" fill="#a94b2f">INGESTION - ONCE PER DOCUMENT, ASYNCHRONOUS</text><path d="M36,52 L142,52 L130,100 L24,100 z" fill="#f9f2f6" stroke="#6b3352" stroke-width="1.4" filter="url(#card)"/><text class="ttl" x="83.0" y="80.0">Owner</text><rect x="170" y="44" width="146" height="58" rx="12" fill="#fdf6f3" stroke="#a94b2f" stroke-width="1.5" filter="url(#card)"/><text class="ttl" x="243.0" y="71.0">1.1 Validate</text><text class="sub" x="243.0" y="86.0">magic bytes</text><rect x="330" y="44" width="146" height="58" rx="12" fill="#fdf6f3" stroke="#a94b2f" stroke-width="1.5" filter="url(#card)"/><text class="ttl" x="403.0" y="71.0">1.2 Extract</text><text class="sub" x="403.0" y="86.0">PDF · DOCX · OCR</text><rect x="490" y="44" width="146" height="58" rx="12" fill="#fdf6f3" stroke="#a94b2f" stroke-width="1.5" filter="url(#card)"/><text class="ttl" x="563.0" y="71.0">1.3 Chunk</text><text class="sub" x="563.0" y="86.0">1,000 / 150 overlap</text><rect x="650" y="44" width="146" height="58" rx="12" fill="#fdf6f3" stroke="#a94b2f" stroke-width="1.5" filter="url(#card)"/><text class="ttl" x="723.0" y="71.0">1.4 Embed</text><text class="sub" x="723.0" y="86.0">bge-small, local</text><path class="lna" d="M142,72 L166,72"/><path class="lna" d="M316,73 L330,73"/><path class="lna" d="M476,73 L490,73"/><path class="lna" d="M636,73 L650,73"/><g filter="url(#card)"><path d="M400,147 a95.0,7 0 0,1 190,0 v38 a95.0,7 0 0,1 -190,0 z" fill="#eef4f4" stroke="#1d5f63" stroke-width="1.4"/><path d="M400,147 a95.0,7 0 0,0 190,0" fill="none" stroke="#1d5f63" stroke-width="1.4"/></g><text class="ttl" x="495.0" y="170.0">D1 rag_documents</text><g filter="url(#card)"><path d="M650,147 a95.0,7 0 0,1 190,0 v38 a95.0,7 0 0,1 -190,0 z" fill="#eef4f4" stroke="#1d5f63" stroke-width="1.4"/><path d="M650,147 a95.0,7 0 0,0 190,0" fill="none" stroke="#1d5f63" stroke-width="1.4"/></g><text class="ttl" x="745.0" y=