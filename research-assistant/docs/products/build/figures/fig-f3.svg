="12" fill="#fdf6f3" stroke="#a94b2f" stroke-width="1.5" filter="url(#card)"/><text class="ttl" x="723.0" y="383.0">2.6 Answer</text><text class="sub" x="723.0" y="398.0">or decline</text><path class="lna" d="M142,288 L166,288"/><path class="lna" d="M316,289 L330,289"/><path class="lna" d="M476,289 L490,289"/><path class="lna" d="M636,289 L650,289"/><path class="lna dash" d="M723,318 L723.0,327.0 Q723,336 714.0,336.0 L572.0,336.0 Q563,336 563.0,345.0 L563,356"/><text class="note" x="576" y="332.0" fill="#a94b2f">no - rewrite once</text><path class="lna" d="M723,336 L723,352"/><text class="note" x="732" y="340.0" fill="#a94b2f">yes</text><path class="lna dash" d="M490,395 L319.0,395.0 Q310,395 310.0,386.0 L310.0,341.0 Q310,332 319.0,332.0 L398.0,332.0 Q403,332 403.0,327.0 L403,322"/><text class="note" x="322" y="352.0" fill="#a94b2f">retry retrieval, once only</text><path class="lnt" d="M650,166 L619.0,166.0 Q610,166 610.0,175.0 L610.0,223.0 Q610,232 601.0,232.0 L412.0,232.0 Q403,232 403.0,241.0 L403,256"/><text class="note" x="412" y="224.0" fill="#1d5f63">chunks + vectors</text><path class="ln dash" d="M723,414 L723.0,439.0 Q723,448 714.0,448.0 L129.0,448.0 Q120,448 120.0,439.0 L120,322"/><text class="note" x="330" y="464.0" fill="#6b6965">answer with the passages it used, or a refusal</text><rect x="24" y="492" width="12" height="12" rx="4" fill="#fff" stroke="#a94b2f" stroke-width="1.6"/><text class="lbl" x="42" y="501.5">process</text><rect x="86.4" y="492" width="12" height="12" rx="4" fill="#fff" stroke="#1d5f63" stroke-width="1.6"/><text class="lbl" x="104.4" y="501.5">store</text><rect x="138.4" y="492" width="12" height="12" rx="4" fill="#fff" stroke="#6b3352" stroke-width="1.6"/><text class="lbl" x="156.4" y="501.5">external</text><rect x="206.0" y="492" width="12" height="12" rx="4" fill="#fff" stroke="#6b6965" stroke-width="1.6"/><text class="lbl" x="224.0" y="501.5">dashed = conditional</text></svg>