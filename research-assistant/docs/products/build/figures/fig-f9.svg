<svg viewBox="0 0 880 566" width="880" height="566" xmlns="http://www.w3.org/2000/svg" role="img"><rect width="880" height="566" fill="#fbfaf7"/><defs><marker id="ar-n" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#6b6965"/></marker><marker id="ar-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#a94b2f"/></marker><marker id="ar-t" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#1d5f63"/></marker><marker id="ar-p" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#6b3352"/></marker><marker id="ar-g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#2f7d55"/></marker><marker id="ar-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#b3402f"/></marker>
<filter id="card" x="-25%" y="-25%" width="150%" height="170%">
  <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#3c3226" flood-opacity="0.13"/>
</filter>
<filter id="lift" x="-25%" y="-25%" width="150%" height="170%">
  <feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#3c3226" flood-opacity="0.10"/>
</filter>
</defs>
<style>
 .ttl { font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif; font-size:12px; font-weight:700; fill:#141413;
        letter-spacing:-.01em; text-anchor:middle }
 .sub { font-family:'JetBrains Mono',Menlo,Consolas,monospace; font-size:8.2px; fill:#6b6965; text-anchor:middle }
 .lbl { font-family:'JetBrains Mono',Menlo,Consolas,monospace; font-size:8.4px; fill:#4d4c48 }
 .lblc{ font-family:'JetBrains Mono',Menlo,Consolas,monospace; font-size:8.4px; fill:#4d4c48; text-anchor:middle }
 .eyb { font-family:'JetBrains Mono',Menlo,Consolas,monospace; font-size:8.6px; font-weight:600; letter-spacing:.14em }
 .idx { font-family:'JetBrains Mono',Menlo,Consolas,monospace; font-size:8px; font-weight:600; text-anchor:middle }
 .note{ font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif; font-size:9.4px; fill:#6b6965 }
 .ln  { fill:none; stroke:#6b6965; stroke-width:1.25; stroke-linecap:round;
        marker-end:url(#ar-n) }
 .lna { fill:none; stroke:#a94b2f; stroke-width:1.5; stroke-linecap:round;
        marker-end:url(#ar-a) }
 .lnt { fill:none; stroke:#1d5f63; stroke-width:1.4; stroke-linecap:round;
        marker-end:url(#ar-t) }
 .lnp { fill:none; stroke:#6b3352; stroke-width:1.4; stroke-linecap:round;
        marker-end:url(#ar-p) }
 .dash{ stroke-dasharray:5 4; stroke-opacity:.85 }
</style><circle cx="150" cy="40" r="9" fill="#141413"/><path class="lna" d="M150,49 L150,72"/><rect x="60" y="72" width="180" height="46" rx="12" fill="#fdf6f3" stroke="#a94b2f" stroke-width="1.5" filter="url(#card)"/><text class="ttl" x="150.0" y="93.0">Contextualise</text><text class="sub" x="150.0" y="108.0">resolve against history</text><path class="lna" d="M150,118 L150,146"/><rect x="60" y="146" width="180" height="46" rx="12" fill="#fdf6f3" stroke="#a94b2f" stroke-width="1.5" filter="url(#card)"/><text class="ttl" x="150.0" y="167.0">Vector search</text><text class="sub" x="150.0" y="182.0">cosine, top 20</text><path class="lna" d="M150,192 L150,220"/><rect x="60" y="220" width="180" height="46" rx="12" fill="#fdf6f3" stroke="#a94b2f" stroke-width="1.5" filter="url(#card)"/><text class="ttl" x="150.0" y="241.0">Keyword search</text><text class="sub" x="150.0" y="256.0">websearch_to_tsquery</text><path class="lna" d="M150,266 L150,294"/><rect x="60" y="294" width="180" height="46" rx="12" fill="#fdf6f3" stroke="#a94b2f" stroke-width="1.5" filter="url(#card)"/><text class="ttl" x="150.0" y="315.0">Fuse rankings</text><text class="sub" x="150.0" y="330.0">RRF, k = 60</text><path class="lna" d="M240,317 L344,317"/><rect x="350" y="294" width="190" height="46" rx="12" fill="#fdf6f3" stroke="#a94b2f" stroke-width="1.5" filter="url(#card)"/><text class="ttl" x="445.0" y="321.0">Grade the passages</text><path class="lna" d="M400,294 L422,246"/><path d="M450,189.0 L550.0,220 L450,251.0 L350.0,220 z" fill="#fdf6f3" stroke="#a94b2f" stroke-width="1.5" filter="url(#card)"/><text class="ttl" x="450" y="224">do they answer it?</text><path class="lna" d="M550,220 L634,220"/><rect x="572" y="203.5" width="23" height="12.5" rx="3" fill="#fbfaf7" fill-opacity=".88"/><text class="note" x="576" y="212.0" fill="#a94b2f">yes</text><rect x="640" y="196" width="190" height="48" rx="12" fill="#eef5f0" stroke="#2f7d55" stroke-width="1.5" filter="url(#card)"/><text class="ttl" x="735.0" y="218.0">Answer from them</text><text class="sub" x="735.0" y="233.0">with citations</text><path class="lna" d="M735,196 L735,160"/><rect x="640" y="104" width="190" height="48" rx="12" fill="#fdf6f3" stroke="#a94b2f" stroke-width="1.5" filter="url(#card)"/><text class="ttl" x="735.0" y="126.0">Judge the answer</text><text class="sub" x="735.0" y="141.0">faithful? relevant?</text><path class="lnt" d="M735,104 L735,68"/><circle cx="735" cy="50" r="11" fill="none" stroke="#141413" stroke-width="2"/><circle cx="735" cy="50" r="6" fill="#141413"/><path class="lna dash" d="M350,220 L309.0,220.0 Q300,220 300.0,229.0 L300.0,395.0 Q300,404 309.0,404.0 L344,404"/><rect x="248" y="275.5" width="65" height="12.5" rx="3" fill="#fbfaf7" fill-opacity=".88"/><text class="note" x="252" y="284.0" fill="#a94b2f">no - and no</text><rect x="248" y="289.0" width="54" height="12.5" rx="3" fill="#fbfaf7" fill-opacity=".88"/><text class="note" x="252" y="297.5" fill="#a94b2f">retry yet</text><rect x="350" y="380" width="190" height="48" rx="12" fill="#fdf6f3" stroke="#a94b2f" stroke-width="1.5" filter="url(#card)"/><text class="ttl" x="445.0" y="402.0">Rewrite the question</text><text class="sub" x="445.0" y="417.0">different wording</text><path class="lna dash" d="M445,428 L445.0,457.0 Q445,466 436.0,466.0 L159.0,466.0 Q150,466 150.0,457.0 L150,346"/><rect x="296" y="475.5" width="142" height="12.5" rx="3" fill="#fbfaf7" fill-opacity=".88"/><text class="note" x="300" y="484.0" fill="#6b6965">retry retrieval, once only</text><path class="lna dash" d="M480,244 L591.0,244.0 Q600,244 600.0,253.0 L600.0,395.0 Q600,404 609.0,404.0 L634,404"/><rect x="604" y="321.5" width="49" height="12.5" rx="3" fill="#fbfaf7" fill-opacity=".88"/><text class="note" x="608" y="330.0" fill="#a94b2f">no - and</text><rect x="604" y="335.0" width="85" height="12.5" rx="3" fill="#fbfaf7" fill-opacity=".88"/><text class="note" x="608" y="343.5" fill="#a94b2f">already retried</text><rect x="640" y="380" width="190" height="48" rx="12" fill="#eef5f0" stroke="#2f7d55" stroke-width="1.5" filter="url(#card)"/><text class="ttl" x="735.0" y="402.0">Decline to answer</text><text class="sub" x="735.0" y="417.0">say what is missing</text><rect x="56" y="511.5" width="425" height="12.5" rx="3" fill="#fbfaf7" fill-opacity=".88"/><text class="note" x="60" y="520.0" fill="#6b6965">Declining is drawn as a success because that is what it is. A system that answers</text><rect x="56" y="525.0" width="430" height="12.5" rx="3" fill="#fbfaf7" fill-opacity=".88"/><text class="note" x="60" y="533.5" fill="#6b6965">every question from a corpus that does not contain the answer is not more useful —</text><rect x="56" y="538.5" width="250" height="12.5" rx="3" fill="#fbfaf7" fill-opacity=".88"/><text class="note" x="60" y="547.0" fill="#6b6965">it is the failure this product exists to avoid.</text></svg>