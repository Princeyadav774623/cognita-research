<svg viewBox="0 0 880 612" width="880" height="612" xmlns="http://www.w3.org/2000/svg" role="img">
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#7c7566"/></marker>
  <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#a06b21"/></marker>
  <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#1d5f63"/></marker>
  <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#6b3352"/></marker>
  <marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L10,5 L0,10" fill="none" stroke="#7c7566" stroke-width="1.4"/></marker>
</defs>
<style>
  .t  { font-family:'Plus Jakarta Sans',sans-serif; font-size:11.5px; fill:#16150f; font-weight:600 }
  .tc { font-family:'Plus Jakarta Sans',sans-serif; font-size:11.5px; fill:#16150f; font-weight:600; text-anchor:middle }
  .s  { font-family:'JetBrains Mono',monospace; font-size:9px; fill:#7c7566 }
  .sc { font-family:'JetBrains Mono',monospace; font-size:9px; fill:#7c7566; text-anchor:middle }
  .lb { font-family:'JetBrains Mono',monospace; font-size:8.5px; fill:#7c7566 }
  .lbc{ font-family:'JetBrains Mono',monospace; font-size:8.5px; fill:#7c7566; text-anchor:middle }
  .cap{ font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:.1em; text-anchor:middle }
  .ln { stroke:#7c7566; stroke-width:1.3; fill:none; marker-end:url(#a) }
  .lnb{ stroke:#a06b21; stroke-width:1.4; fill:none; marker-end:url(#ab) }
  .lnt{ stroke:#1d5f63; stroke-width:1.4; fill:none; marker-end:url(#at) }
  .lnp{ stroke:#6b3352; stroke-width:1.4; fill:none; marker-end:url(#ap) }
  .dash{ stroke-dasharray:4 3 }
  .proc{ fill:#fff; stroke:#a06b21; stroke-width:1.6 }
  .store{ fill:#f7f4ed; stroke:#1d5f63; stroke-width:1.5 }
  .ext { fill:#faf6f8; stroke:#6b3352; stroke-width:1.5 }
  .band{ fill:#faf7f1; stroke:#ddd6c8; stroke-width:1 }
  .ok  { fill:#eef5f1; stroke:#1f6b4a; stroke-width:1.6 }
  .bad { fill:#fbf0ef; stroke:#9c2f26; stroke-width:1.6 }
</style><rect width="880" height="612" fill="#ffffff"/><circle cx="150" cy="40" r="9" fill="#16150f"/><path class="lnb" d="M150,49 L150,72"/><rect class="proc" x="60" y="72" width="180" height="46" rx="8"/><text class="tc" x="150.0" y="92.0">Classify effort</text><text class="sc" x="150.0" y="106.0">triage</text><path class="lnb" d="M150,118 L150,146"/><path class="proc" d="M150,146.0 L225.0,176 L150,206.0 L75.0,176 z"/><text class="tc" x="150" y="179">research needed?</text><path class="lnb" d="M225,176 L320,176 L320,210 L426,210"/><text class="lb" x="268" y="168" fill="#a06b21">no</text><rect class="ok" x="430" y="186" width="180" height="48" rx="8"/><text class="tc" x="520.0" y="207.0">Answer directly</text><text class="sc" x="520.0" y="221.0">chat reply</text><path class="lnb" d="M610,210 L636,210"/><path class="lnb" d="M150,206 L150,238"/><text class="lb" x="158" y="228" fill="#a06b21">yes</text><rect class="proc" x="60" y="238" width="180" height="46" rx="8"/><text class="tc" x="150.0" y="263.0">Plan sub-queries</text><path class="lnb" d="M150,284 L150,312"/><rect class="proc" x="60" y="312" width="180" height="46" rx="8"/><text class="tc" x="150.0" y="337.0">Search and read</text><path class="lnb" d="M150,358 L150,386"/><rect class="proc" x="60" y="386" width="180" height="46" rx="8"/><text class="tc" x="150.0" y="411.0">Retrieve user corpus</text><path class="lnb" d="M150,432 L150,460"/><rect class="proc" x="60" y="460" width="180" height="46" rx="8"/><text class="tc" x="150.0" y="485.0">Synthesise draft</text><path class="lnb" d="M240,483 L344,483"/><rect class="proc" x="350" y="460" width="200" height="46" rx="8"/><text class="tc" x="450.0" y="485.0">Verify each claim</text><text class="lb" x="350" y="528" fill="#7c7566">searched separately and concurrently, against</text><text class="lb" x="350" y="541" fill="#7c7566">sources the draft was not written from</text><path class="lnb" d="M450,460 L450,420"/><path class="proc" d="M450,355.0 L545.0,386 L450,417.0 L355.0,386 z"/><text class="tc" x="450" y="389">evidence sufficient?</text><path class="lnb dash" d="M355,386 L300,386 L300,335 L244,335"/><text class="lb" x="256" y="322" fill="#a06b21">no - iterations remain</text><path class="lnb" d="M545,386 L634,386"/><text class="lb" x="570" y="378" fill="#a06b21">yes</text><rect class="proc" x="640" y="362" width="190" height="48" rx="8"/><text class="tc" x="735.0" y="388.0">Score the run</text><path class="lnb" d="M735,362 L735,326"/><rect class="proc" x="640" y="278" width="190" height="48" rx="8"/><text class="tc" x="735.0" y="299.0">Assemble report</text><text class="sc" x="735.0" y="313.0">sources joined in code</text><path class="lnt" d="M735,278 L735,238"/><rect class="ok" x="640" y="186" width="190" height="48" rx="8"/><text class="tc" x="735.0" y="212.0">Stream to browser</text><path class="lnb" d="M735,186 L735,164"/><circle cx="735" cy="150" r="11" fill="none" stroke="#16150f" stroke-width="2"/><circle cx="735" cy="150" r="6" fill="#16150f"/><text class="lb" x="60" y="568" fill="#7c7566">The backward edge is the structural claim of this product: a chain cannot return to an</text><text class="lb" x="60" y="581" fill="#7c7566">earlier step, a graph with conditional edges can, and thin evidence is exactly the case</text><text class="lb" x="60" y="594" fill="#7c7566">where returning is the correct behaviour.</text></svg>