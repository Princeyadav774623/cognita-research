<svg viewBox="0 0 880 612" width="880" height="612" xmlns="http://www.w3.org/2000/svg" role="img"><rect width="880" height="612" fill="#fbfaf7"/><defs><marker id="ar-n" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#6b6965"/></marker><marker id="ar-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#a94b2f"/></marker><marker id="ar-t" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#1d5f63"/></marker><marker id="ar-p" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#6b3352"/></marker><marker id="ar-g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#2f7d55"/></marker><marker id="ar-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#b3402f"/></marker>
<filter id="card" x="-25%" y="-25%" width="150%" height="170%">
  <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#3c3226" flood-opacity="0.13"/>
</filter>
<filter id="lift" x="-25%" y="-25%" width="150%" height="170%">
  <feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#3c3226" flood-opacity="0.10"/>
</filter>
</defs>
<style>
 .ttl { font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif; font-size:12px; font-weight:700; fill:#141413;
        letter-spacing:-.01em; text-anchor:middle }
 .sub { font-family:'JetBrains Mono',Menlo,Consolas,monospace; font-size:8.2px; fill:#6b6965; text-anchor:middle }
 .lbl { font-family:'JetBrains Mono',Menlo,Consolas,monospace; font-size:8.4px; fill:#4d4c48 }
 .lblc{ font-family:'JetBrains Mono',Menlo,Consolas,monospace; font-size:8.4px; fill:#4d4c48; text-anchor:middle }
 .eyb { font-family:'JetBrains Mono',Menlo,Consolas,monospace; font-size:8.6px; font-weight:600; letter-spacing:.14em }
 .idx { font-family:'JetBrains Mono',Menlo,Consolas,monospace; font-size:8px; font-weight:600; text-anchor:middle }
 .note{ font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif; font-size:9.4px; fill:#6b6965 }
 .ln  { fill:none; stroke:#6b6965; stroke-width:1.25; stroke-linecap:round;
        marker-end:url(#ar-n) }
 .lna { fill:none; stroke:#a94b2f; stroke-width:1.5; stroke-linecap:round;
        marker-end:url(#ar-a) }
 .lnt { fill:none; stroke:#1d5f63; stroke-width:1.4; stroke-linecap:round;
        marker-end:url(#ar-t) }
 .lnp { fill:none; stroke:#6b3352; stroke-width:1.4; stroke-linecap:round;
        marker-end:url(#ar-p) }
 .dash{ stroke-dasharray:5 4; stroke-opacity:.85 }
</style><circle cx="150" cy="40" r="9" fill="#141413"/><path class="lna" d="M150,49 L150,72"/><rect x="60" y="72" width="180" height="46" rx="12" fill="#fdf6f3" stroke="#a94b2f" stroke-width="1.5" filter="url(#card)"/><text class="ttl" x="150.0" y="93.0">Classify effort</text><text class="sub" x="150.0" y="108.0">triage</text><path class="lna" d="M150,118 L150,146"/><path d="M150,146.0 L225.0,176 L150,206.0 L75.0,176 z" fill="#fdf6f3" stroke="#a94b2f" stroke-width="1.5" filter="url(#card)"/><text class="ttl" x="150" y="180">research needed?</text><path class="lna" d="M225,176 L311.0,176.0 Q320,176 320.0,185.0 L320.0,201.0 Q320,210 329.0,210.0 L426,210"/><text class="note" x="268" y="168.0" fill="#a94b2f">no</text><rect x="430" y="186" width="180" height="48" rx="12" fill="#eef5f0" stroke="#2f7d55" stroke-width="1.5" filter="url(#card)"/><text class="ttl" x="520.0" y="208.0">Answer directly</text><text class="sub" x="520.0" y="223.0">chat reply</text><path class="lna" d="M610,210 L636,210"/><path class="lna" d="M150,206 L150,238"/><text class="note" x="158" y="228.0" fill="#a94b2f">yes</text><rect x="60" y="238" width="180" height="46" rx="12" fill="#fdf6f3" stroke="#a94b2f" stroke-width="1.5" filter="url(#card)"/><text class="ttl" x="150.0" y="265.0">Plan sub-queries</text><path class="lna" d="M150,284 L150,312"/><rect x="60" y="312" width="180" height="46" rx="12" fill="#fdf6f3" stroke="#a94b2f" stroke-width="1.5" filter="url(#card)"/><text class="ttl" x="150.0" y="339.0">Search and read</text><path class="lna" d="M150,358 L150,386"/><rect x="60" y="386" width="180" height="46" rx="12" fill="#fdf6f3" stroke="#a94b2f" stroke-width="1.5" filter="url(#card)"/><text class="ttl" x="150.0" y="413.0">Retrieve user corpus</text><path class="lna" d="M150,432 L150,460"/><rect x="60" y="460" width="180" height="46" rx="12" fill="#fdf6f3" stroke="#a94b2f" stroke-width="1.5" filter="url(#card)"/><text class="ttl" x="150.0" y="487.0">Synthesise draft</text><path class="lna" d="M240,483 L344,483"/><rect x="350" y="460" width="200" height="46" rx="12" fill="#fdf6f3" stroke="#a94b2f" stroke-width="1.5" filter="url(#card)"/><text class="ttl" x="450.0" y="487.0">Verify each claim</text><text class="note" x="350" y="528.0" fill="#6b6965">searched separately and concurrently, against</text><text class="note" x="350" y="541.5" fill="#6b6965">sources the draft was not written from</text><path class="lna" d="M450,460 L450,420"/><path d="M450,355.0 L545.0,386 L450,417.0 L355.0,386 z" fill="#fdf6f3" stroke="#a94b2f" stroke-width="1.5" filter="url(#card)"/><text class="ttl" x="450" y="390">evidence sufficient?</text><path class="lna dash" d="M355,386 L309.0,386.0 Q300,386 300.0,377.0 L300.0,344.0 Q300,335 291.0,335.0 L244,335"/><text class="note" x="256" y="322.0" fill="#a94b2f">no - iterations remain</text><path class="lna" d="M545,386 L634,386"/><text class="note" x="570" y="378.0" fill="#a94b2f">yes</text><rect x="640" y="362" width="190" height="48" rx="12" fill="#fdf6f3" stroke="#a94b2f" stroke-width="1.5" filter="url(#card)"/><text class="ttl" x="735.0" y="390.0">Score the run</text><path class="lna" d="M735,362 L735,326"/><rect x="640" y="278" width="190" height="48" rx="12" fill="#fdf6f3" stroke="#a94b2f" stroke-width="1.5" filter="url(#card)"/><text class="ttl" x="735.0" y="300.0">Assemble report</text><text class="sub" x="735.0" y="315.0">sources joined in code</text><path class="lnt" d="M735,278 L735,238"/><rect x="640" y="186" width="190" height="48" rx="12" fill="#eef5f0" stroke="#2f7d55" stroke-width="1.5" filter="url(#card)"/><text class="ttl" x="735.0" y="214.0">Stream to browser</text><path class="lna" d="M735,186 L735,164"/><circle cx="735" cy="150" r="11" fill="none" stroke="#141413" stroke-width="2"/><circle cx="735" cy="150" r="6" fill="#141413"/><text class="note" x="60" y="568.0" fill="#6b6965">The backward edge is the structural claim of this product: a chain cannot return to an</text><text class="note" x="60" y="581.5" fill="#6b6965">earlier step, a graph with conditional edges can, and thin evidence is exactly the case</text><text class="note" x="60" y="595.0" fill="#6b6965">where returning is the correct behaviour.</text></svg>