<svg viewBox="0 0 880 484" width="880" height="484" xmlns="http://www.w3.org/2000/svg" role="img">
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#7c7566"/></marker>
  <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#a06b21"/></marker>
  <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#1d5f63"/></marker>
  <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#6b3352"/></marker>
  <marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L10,5 L0,10" fill="none" stroke="#7c7566" stroke-width="1.4"/></marker>
</defs>
<style>
  .t  { font-family:'Plus Jakarta Sans',sans-serif; font-size:11.5px; fill:#16150f; font-weight:600 }
  .tc { font-family:'Plus Jakarta Sans',sans-serif; font-size:11.5px; fill:#16150f; font-weight:600; text-anchor:middle }
  .s  { font-family:'JetBrains Mono',monospace; font-size:9px; fill:#7c7566 }
  .sc { font-family:'JetBrains Mono',monospace; font-size:9px; fill:#7c7566; text-anchor:middle }
  .lb { font-family:'JetBrains Mono',monospace; font-size:8.5px; fill:#7c7566 }
  .lbc{ font-family:'JetBrains Mono',monospace; font-size:8.5px; fill:#7c7566; text-anchor:middle }
  .cap{ font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:.1em; text-anchor:middle }
  .ln { stroke:#7c7566; stroke-width:1.3; fill:none; marker-end:url(#a) }
  .lnb{ stroke:#a06b21; stroke-width:1.4; fill:none; marker-end:url(#ab) }
  .lnt{ stroke:#1d5f63; stroke-width:1.4; fill:none; marker-end:url(#at) }
  .lnp{ stroke:#6b3352; stroke-width:1.4; fill:none; marker-end:url(#ap) }
  .dash{ stroke-dasharray:4 3 }
  .proc{ fill:#fff; stroke:#a06b21; stroke-width:1.6 }
  .store{ fill:#f7f4ed; stroke:#1d5f63; stroke-width:1.5 }
  .ext { fill:#faf6f8; stroke:#6b3352; stroke-width:1.5 }
  .band{ fill:#faf7f1; stroke:#ddd6c8; stroke-width:1 }
  .ok  { fill:#eef5f1; stroke:#1f6b4a; stroke-width:1.6 }
  .bad { fill:#fbf0ef; stroke:#9c2f26; stroke-width:1.6 }
</style><rect width="880" height="484" fill="#ffffff"/><circle cx="60" cy="86" r="9" fill="#16150f"/><path class="lnb" d="M69,86 L116,86"/><rect class="proc" x="120" y="60" width="160" height="52" rx="8"/><text class="tc" x="200.0" y="83.0">uploaded</text><text class="sc" x="200.0" y="97.0">row exists</text><path class="lnb" d="M280,86 L326,86"/><rect class="proc" x="330" y="60" width="160" height="52" rx="8"/><text class="tc" x="410.0" y="83.0">extracting</text><text class="sc" x="410.0" y="97.0">by type</text><path class="lnb" d="M490,86 L536,86"/><rect class="proc" x="540" y="60" width="160" height="52" rx="8"/><text class="tc" x="620.0" y="83.0">chunking</text><text class="sc" x="620.0" y="97.0">1,000 / 150</text><path class="lnb" d="M620,112 L620,150 L200,150 L200,186"/><rect class="proc" x="120" y="186" width="160" height="52" rx="8"/><text class="tc" x="200.0" y="209.0">embedding</text><text class="sc" x="200.0" y="223.0">local, 384-d</text><path class="lnb" d="M280,212 L326,212"/><rect class="ok" x="330" y="186" width="180" height="52" rx="8"/><text class="tc" x="420.0" y="209.0">ready</text><text class="sc" x="420.0" y="223.0">answerable</text><rect class="bad" x="330" y="316" width="180" height="52" rx="8"/><text class="tc" x="420.0" y="339.0">failed</text><text class="sc" x="420.0" y="353.0">unsupported or corrupt</text><path class="lnb dash" d="M410,112 L410,130 L300,130 L300,342 L326,342"/><text class="lb" x="214" y="300" fill="#9c2f26">any ingest step,</text><text class="lb" x="214" y="313" fill="#9c2f26">on error</text><rect class="bad" x="600" y="316" width="200" height="52" rx="8"/><text class="tc" x="700.0" y="339.0">failed (stale)</text><text class="sc" x="700.0" y="353.0">reaped after 15 min</text><path class="lnb dash" d="M200,238 L200,280 L700,280 L700,312"/><text class="lb" x="360" y="274" fill="#8a6314">process restarted mid-ingest</text><rect class="ok" x="600" y="186" width="200" height="52" rx="8"/><text class="tc" x="700.0" y="209.0">deleted</text><text class="sc" x="700.0" y="223.0">chunks cascade</text><path class="lnb" d="M510,212 L596,212"/><text class="lb" x="520" y="174" fill="#a06b21">on request</text><text class="lb" x="120" y="396" fill="#7c7566">There is no durable queue behind this. A restart between 'uploaded' and 'ready'</text><text class="lb" x="120" y="409" fill="#7c7566">strands the row, and the reaper is what stops it sitting in 'processing' forever —</text><text class="lb" x="120" y="422" fill="#7c7566">a mitigation, not a fix. Chapter 10 says so plainly.</text><rect x="120" y="456" width="11" height="11" rx="3" fill="#fff" stroke="#a06b21" stroke-width="1.6"/><text class="lb" x="137" y="465">in progress</text><rect x="201.4" y="456" width="11" height="11" rx="3" fill="#fff" stroke="#1f6b4a" stroke-width="1.6"/><text class="lb" x="218.4" y="465">terminal success</text><rect x="309.8" y="456" width="11" height="11" rx="3" fill="#fff" stroke="#9c2f26" stroke-width="1.6"/><text class="lb" x="326.8" y="465">terminal failure</text><rect x="418.20000000000005" y="456" width="11" height="11" rx="3" fill="#fff" stroke="#7c7566" stroke-width="1.6"/><text class="lb" x="435.20000000000005" y="465">dashed = conditional</text></svg>