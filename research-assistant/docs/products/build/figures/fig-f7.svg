<svg viewBox="0 0 880 484" width="880" height="484" xmlns="http://www.w3.org/2000/svg" role="img"><rect width="880" height="484" fill="#fbfaf7"/><defs><marker id="ar-n" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#6b6965"/></marker><marker id="ar-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#a94b2f"/></marker><marker id="ar-t" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#1d5f63"/></marker><marker id="ar-p" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#6b3352"/></marker><marker id="ar-g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#2f7d55"/></marker><marker id="ar-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#b3402f"/></marker>
<filter id="card" x="-25%" y="-25%" width="150%" height="170%">
  <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#3c3226" flood-opacity="0.13"/>
</filter>
<filter id="lift" x="-25%" y="-25%" width="150%" height="170%">
  <feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#3c3226" flood-opacity="0.10"/>
</filter>
</defs>
<style>
 .ttl { font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif; font-size:12px; font-weight:700; fill:#141413;
        letter-spacing:-.01em; text-anchor:middle }
 .sub { font-family:'JetBrains Mono',Menlo,Consolas,monospace; font-size:8.2px; fill:#6b6965; text-anchor:middle }
 .lbl { font-family:'JetBrains Mono',Menlo,Consolas,monospace; font-size:8.4px; fill:#4d4c48 }
 .lblc{ font-family:'JetBrains Mono',Menlo,Consolas,monospace; font-size:8.4px; fill:#4d4c48; text-anchor:middle }
 .eyb { font-family:'JetBrains Mono',Menlo,Consolas,monospace; font-size:8.6px; font-weight:600; letter-spacing:.14em }
 .idx { font-family:'JetBrains Mono',Menlo,Consolas,monospace; font-size:8px; font-weight:600; text-anchor:middle }
 .note{ font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif; font-size:9.4px; fill:#6b6965 }
 .ln  { fill:none; stroke:#6b6965; stroke-width:1.25; stroke-linecap:round;
        marker-end:url(#ar-n) }
 .lna { fill:none; stroke:#a94b2f; stroke-width:1.5; stroke-linecap:round;
        marker-end:url(#ar-a) }
 .lnt { fill:none; stroke:#1d5f63; stroke-width:1.4; stroke-linecap:round;
        marker-end:url(#ar-t) }
 .lnp { fill:none; stroke:#6b3352; stroke-width:1.4; stroke-linecap:round;
        marker-end:url(#ar-p) }
 .dash{ stroke-dasharray:5 4; stroke-opacity:.85 }
</style><circle cx="60" cy="86" r="9" fill="#141413"/><path class="lna" d="M69,86 L116,86"/><rect x="120" y="60" width="160" height="52" rx="12" fill="#fdf6f3" stroke="#a94b2f" stroke-width="1.5" filter="url(#card)"/><text class="ttl" x="200.0" y="84.0">uploaded</text><text class="sub" x="200.0" y="99.0">row exists</text><path class="lna" d="M280,86 L326,86"/><rect x="330" y="60" width="160" height="52" rx="12" fill="#fdf6f3" stroke="#a94b2f" stroke-width="1.5" filter="url(#card)"/><text class="ttl" x="410.0" y="84.0">extracting</text><text class="sub" x="410.0" y="99.0">by type</text><path class="lna" d="M490,86 L536,86"/><rect x="540" y="60" width="160" height="52" rx="12" fill="#fdf6f3" stroke="#a94b2f" stroke-width="1.5" filter="url(#card)"/><text class="ttl" x="620.0" y="84.0">chunking</text><text class="sub" x="620.0" y="99.0">1,000 / 150</text><path class="lna" d="M620,112 L620.0,141.0 Q620,150 611.0,150.0 L209.0,150.0 Q200,150 200.0,159.0 L200,186"/><rect x="120" y="186" width="160" height="52" rx="12" fill="#fdf6f3" stroke="#a94b2f" stroke-width="1.5" filter="url(#card)"/><text class="ttl" x="200.0" y="210.0">embedding</text><text class="sub" x="200.0" y="225.0">local, 384-d</text><path class="lna" d="M280,212 L326,212"/><rect x="330" y="186" width="180" height="52" rx="12" fill="#eef5f0" stroke="#2f7d55" stroke-width="1.5" filter="url(#card)"/><text class="ttl" x="420.0" y="210.0">ready</text><text class="sub" x="420.0" y="225.0">answerable</text><rect x="330" y="316" width="180" height="52" rx="12" fill="#fbf0ee" stroke="#b3402f" stroke-width="1.5" filter="url(#card)"/><text class="ttl" x="420.0" y="340.0">failed</text><text class="sub" x="420.0" y="355.0">unsupported or corrupt</text><path class="lna dash" d="M410,112 L410.0,121.0 Q410,130 401.0,130.0 L309.0,130.0 Q300,130 300.0,139.0 L300.0,333.0 Q300,342 309.0,342.0 L326,342"/><rect x="210" y="291.5" width="90" height="12.5" rx="3" fill="#fbfaf7" fill-opacity=".88"/><text class="note" x="214" y="300.0" fill="#b3402f">any ingest step,</text><rect x="210" y="305.0" width="49" height="12.5" rx="3" fill="#fbfaf7" fill-opacity=".88"/><text class="note" x="214" y="313.5" fill="#b3402f">on error</text><rect x="600" y="316" width="200" height="52" rx="12" fill="#fbf0ee" stroke="#b3402f" stroke-width="1.5" filter="url(#card)"/><text class="ttl" x="700.0" y="340.0">failed (stale)</text><text class="sub" x="700.0" y="355.0">reaped after 15 min</text><path class="lna dash" d="M200,238 L200.0,271.0 Q200,280 209.0,280.0 L691.0,280.0 Q700,280 700.0,289.0 L700,312"/><rect x="356" y="265.5" width="152" height="12.5" rx="3" fill="#fbfaf7" fill-opacity=".88"/><text class="note" x="360" y="274.0" fill="#a8690d">process restarted mid-ingest</text><rect x="600" y="186" width="200" height="52" rx="12" fill="#eef5f0" stroke="#2f7d55" stroke-width="1.5" filter="url(#card)"/><text class="ttl" x="700.0" y="210.0">deleted</text><text class="sub" x="700.0" y="225.0">chunks cascade</text><path class="lna" d="M510,212 L596,212"/><rect x="516" y="165.5" width="60" height="12.5" rx="3" fill="#fbfaf7" fill-opacity=".88"/><text class="note" x="520" y="174.0" fill="#a94b2f">on request</text><rect x="116" y="387.5" width="415" height="12.5" rx="3" fill="#fbfaf7" fill-opacity=".88"/><text class="note" x="120" y="396.0" fill="#6b6965">There is no durable queue behind this. A restart between 'uploaded' and 'ready'</text><rect x="116" y="401.0" width="430" height="12.5" rx="3" fill="#fbfaf7" fill-opacity=".88"/><text class="note" x="120" y="409.5" fill="#6b6965">strands the row, and the reaper is what stops it sitting in 'processing' forever —</text><rect x="116" y="414.5" width="276" height="12.5" rx="3" fill="#fbfaf7" fill-opacity=".88"/><text class="note" x="120" y="423.0" fill="#6b6965">a mitigation, not a fix. Chapter 10 says so plainly.</text><rect x="120" y="456" width="12" height="12" rx="4" fill="#fff" stroke="#a94b2f" stroke-width="1.6"/><text class="lbl" x="138" y="465.5">in progress</text><rect x="203.2" y="456" width="12" height="12" rx="4" fill="#fff" stroke="#2f7d55" stroke-width="1.6"/><text class="lbl" x="221.2" y="465.5">terminal success</text><rect x="312.4" y="456" width="12" height="12" rx="4" fill="#fff" stroke="#b3402f" stroke-width="1.6"/><text class="lbl" x="330.4" y="465.5">terminal failure</text><rect x="421.59999999999997" y="456" width="12" height="12" rx="4" fill="#fff" stroke="#6b6965" stroke-width="1.6"/><text class="lbl" x="439.59999999999997" y="465.5">dashed = conditional</text></svg>