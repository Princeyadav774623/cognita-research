8 L812,266 L646,266 z"/><text class="tc" x="735.0" y="239.0">Groq</text><text class="sc" x="735.0" y="253.0">20B / 120B</text><path class="ext" d="M658,278 L824,278 L812,326 L646,326 z"/><text class="tc" x="735.0" y="299.0">Web search</text><text class="sc" x="735.0" y="313.0">sub-queries</text><path class="ext" d="M658,338 L824,338 L812,386 L646,386 z"/><text class="tc" x="735.0" y="359.0">Supabase</text><text class="sc" x="735.0" y="373.0">JWKS</text><path class="ln" d="M248,92 L332,92"/><text class="lbc" x="290.0" y="86.0">HTTPS</text><path class="lnb" d="M248,164 L332,100"/><text class="lbc" x="290.0" y="126.0">WSS</text><path class="lnt" d="M558,96 L642,96"/><text class="lbc" x="600.0" y="90.0">cognita_app role</text><path class="lnp" d="M558,164 L642,240"/><path class="lnp" d="M558,172 L642,300"/><text class="lb" x="30" y="362" fill="#7c7566">all runtime queries use the low-privilege role, so row-level</text><text class="lb" x="30" y="375" fill="#7c7566">security applies to every read this product makes</text></svg>