<svg viewBox="0 0 880 590" width="880" height="590" xmlns="http://www.w3.org/2000/svg" role="img">
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#7c7566"/></marker>
  <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#a06b21"/></marker>
  <marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#1d5f63"/></marker>
  <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#6b3352"/></marker>
  <marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0,0 L10,5 L0,10" fill="none" stroke="#7c7566" stroke-width="1.4"/></marker>
</defs>
<style>
  .t  { font-family:'Plus Jakarta Sans',sans-serif; font-size:11.5px; fill:#16150f; font-weight:600 }
  .tc { font-family:'Plus Jakarta Sans',sans-serif; font-size:11.5px; fill:#16150f; font-weight:600; text-anchor:middle }
  .s  { font-family:'JetBrains Mono',monospace; font-size:9px; fill:#7c7566 }
  .sc { font-family:'JetBrains Mono',monospace; font-size:9px; fill:#7c7566; text-anchor:middle }
  .lb { font-family:'JetBrains Mono',monospace; font-size:8.5px; fill:#7c7566 }
  .lbc{ font-family:'JetBrains Mono',monospace; font-size:8.5px; fill:#7c7566; text-anchor:middle }
  .cap{ font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:.1em; text-anchor:middle }
  .ln { stroke:#7c7566; stroke-width:1.3; fill:none; marker-end:url(#a) }
  .lnb{ stroke:#a06b21; stroke-width:1.4; fill:none; marker-end:url(#ab) }
  .lnt{ stroke:#1d5f63; stroke-width:1.4; fill:none; marker-end:url(#at) }
  .lnp{ stroke:#6b3352; stroke-width:1.4; fill:none; marker-end:url(#ap) }
  .dash{ stroke-dasharray:4 3 }
  .proc{ fill:#fff; stroke:#a06b21; stroke-width:1.6 }
  .store{ fill:#f7f4ed; stroke:#1d5f63; stroke-width:1.5 }
  .ext { fill:#faf6f8; stroke:#6b3352; stroke-width:1.5 }
  .band{ fill:#faf7f1; stroke:#ddd6c8; stroke-width:1 }
  .ok  { fill:#eef5f1; stroke:#1f6b4a; stroke-width:1.6 }
  .bad { fill:#fbf0ef; stroke:#9c2f26; stroke-width:1.6 }
</style><rect width="880" height="590" fill="#ffffff"/><rect class="proc" x="20.0" y="26" width="132" height="34" rx="8"/><text class="tc" x="86.0" y="45.0">Browser</text><path d="M86,60 L86,530" stroke="#7c7566" stroke-width="1" stroke-dasharray="3 4" fill="none"/><rect class="proc" x="182.0" y="26" width="132" height="34" rx="8"/><text class="tc" x="248.0" y="45.0">WebSocket</text><path d="M248,60 L248,530" stroke="#7c7566" stroke-width="1" stroke-dasharray="3 4" fill="none"/><rect class="proc" x="364.0" y="26" width="132" height="34" rx="8"/><text class="tc" x="430.0" y="45.0">LangGraph pipeline</text><path d="M430,60 L430,530" stroke="#7c7566" stroke-width="1" stroke-dasharray="3 4" fill="none"/><rect class="ext" x="546.0" y="26" width="132" height="34" rx="8"/><text class="tc" x="612.0" y="45.0">Web + Groq</text><path d="M612,60 L612,530" stroke="#7c7566" stroke-width="1" stroke-dasharray="3 4" fill="none"/><rect class="store" x="716.0" y="26" width="132" height="34" rx="8"/><text class="tc" x="782.0" y="45.0">Postgres</text><path d="M782,60 L782,530" stroke="#7c7566" stroke-width="1" stroke-dasharray="3 4" fill="none"/><text class="lb" x="204" y="82" fill="#7c7566">/ws/research</text><path class="ln" d="M92,118 L242,118"/><text class="lbc" x="167.0" y="112">open socket, send question</text><path class="lnt" d="M254,150 L776,150"/><text class="lbc" x="515.0" y="144">consume 1 query from quota</text><path class="lnb" d="M254,182 L424,182"/><text class="lbc" x="339.0" y="176">invoke graph</text><path class="lnp" d="M436,214 L606,214"/><text class="lbc" x="521.0" y="208">triage, then plan sub-queries  (20B)</text><path class="lnp" d="M436,246 L606,246"/><text class="lbc" x="521.0" y="240">run searches, fetch and extract pages</text><path class="lnt dash" d="M436,278 L776,278"/><text class="lbc" x="606.0" y="272">retrieve from the user's corpus</text><path class="lnp" d="M436,310 L606,310"/><text class="lbc" x="521.0" y="304">synthesise a draft  (120B)</text><path class="lnp" d="M436,342 L606,342"/><text class="lbc" x="521.0" y="336">verify every claim independently  (120B)</text><path class="ln" d="M436,374 L490,374 L490,394 L440,394"/><text class="lb" x="498" y="388">gap analysis: is the evidence enough?</text><path class="lnb dash" d="M424,412 L348,412 L348,214 L422,214"/><text class="lb" x="258" y="300" fill="#a06b21">no - loop back</text><text class="lb" x="258" y="313" fill="#a06b21">to searching</text><path class="lnt" d="M436,442 L776,442"/><text class="lbc" x="606.0" y="436">persist report, tokens and cost</text><path class="lnb" d="M424,474 L254,474"/><text class="lbc" x="339.0" y="468">stream report tokens</text><path class="ln" d="M242,506 L92,506"/><text class="lbc" x="167.0" y="500">render progressively</text><text class="lb" x="24" y="556" fill="#7c7566">Responses are omitted for clarity. Every step also emits a progress event on the</text><text class="lb" x="24" y="569" fill="#7c7566">same socket — that stream is what drives the live pipeline animation in the interface.</text></svg>