<svg viewBox="0 0 880 590" width="880" height="590" xmlns="http://www.w3.org/2000/svg" role="img"><rect width="880" height="590" fill="#fbfaf7"/><defs><marker id="ar-n" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#6b6965"/></marker><marker id="ar-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#a94b2f"/></marker><marker id="ar-t" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#1d5f63"/></marker><marker id="ar-p" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#6b3352"/></marker><marker id="ar-g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#2f7d55"/></marker><marker id="ar-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#b3402f"/></marker>
<filter id="card" x="-25%" y="-25%" width="150%" height="170%">
  <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#3c3226" flood-opacity="0.13"/>
</filter>
<filter id="lift" x="-25%" y="-25%" width="150%" height="170%">
  <feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#3c3226" flood-opacity="0.10"/>
</filter>
</defs>
<style>
 .ttl { font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif; font-size:12px; font-weight:700; fill:#141413;
        letter-spacing:-.01em; text-anchor:middle }
 .sub { font-family:'JetBrains Mono',Menlo,Consolas,monospace; font-size:8.2px; fill:#6b6965; text-anchor:middle }
 .lbl { font-family:'JetBrains Mono',Menlo,Consolas,monospace; font-size:8.4px; fill:#4d4c48 }
 .lblc{ font-family:'JetBrains Mono',Menlo,Consolas,monospace; font-size:8.4px; fill:#4d4c48; text-anchor:middle }
 .eyb { font-family:'JetBrains Mono',Menlo,Consolas,monospace; font-size:8.6px; font-weight:600; letter-spacing:.14em }
 .idx { font-family:'JetBrains Mono',Menlo,Consolas,monospace; font-size:8px; font-weight:600; text-anchor:middle }
 .note{ font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif; font-size:9.4px; fill:#6b6965 }
 .ln  { fill:none; stroke:#6b6965; stroke-width:1.25; stroke-linecap:round;
        marker-end:url(#ar-n) }
 .lna { fill:none; stroke:#a94b2f; stroke-width:1.5; stroke-linecap:round;
        marker-end:url(#ar-a) }
 .lnt { fill:none; stroke:#1d5f63; stroke-width:1.4; stroke-linecap:round;
        marker-end:url(#ar-t) }
 .lnp { fill:none; stroke:#6b3352; stroke-width:1.4; stroke-linecap:round;
        marker-end:url(#ar-p) }
 .dash{ stroke-dasharray:5 4; stroke-opacity:.85 }
</style><rect x="12.0" y="26" width="148" height="36" rx="12" fill="#fdf6f3" stroke="#a94b2f" stroke-width="1.5" filter="url(#card)"/><text class="ttl" x="86.0" y="48.0">Browser</text><path d="M86,62 L86,530" stroke="#ddd8cc" stroke-width="1.2" stroke-dasharray="3 5" fill="none"/><rect x="174.0" y="26" width="148" height="36" rx="12" fill="#fdf6f3" stroke="#a94b2f" stroke-width="1.5" filter="url(#card)"/><text class="ttl" x="248.0" y="48.0">WebSocket</text><path d="M248,62 L248,530" stroke="#ddd8cc" stroke-width="1.2" stroke-dasharray="3 5" fill="none"/><rect x="356.0" y="26" width="148" height="36" rx="12" fill="#fdf6f3" stroke="#a94b2f" stroke-width="1.5" filter="url(#card)"/><text class="ttl" x="430.0" y="48.0">LangGraph pipeline</text><path d="M430,62 L430,530" stroke="#ddd8cc" stroke-width="1.2" stroke-dasharray="3 5" fill="none"/><rect x="538.0" y="26" width="148" height="36" rx="12" fill="#f9f2f6" stroke="#6b3352" stroke-width="1.4" filter="url(#card)"/><text class="ttl" x="612.0" y="48.0">Web + Groq</text><path d="M612,62 L612,530" stroke="#ddd8cc" stroke-width="1.2" stroke-dasharray="3 5" fill="none"/><rect x="708.0" y="26" width="148" height="36" rx="12" fill="#eef4f4" stroke="#1d5f63" stroke-width="1.4" filter="url(#card)"/><text class="ttl" x="782.0" y="48.0">Postgres</text><path d="M782,62 L782,530" stroke="#ddd8cc" stroke-width="1.2" stroke-dasharray="3 5" fill="none"/><text class="note" x="204" y="82.0" fill="#6b6965">/ws/research</text><path class="ln" d="M92,118 L242,118"/><rect x="96.48" y="102.5" width="141.04" height="13" rx="4" fill="#fbfaf7" fill-opacity=".95"/><text class="lblc" x="167.0" y="111">open socket, send question</text><path class="lnt" d="M254,150 L776,150"/><rect x="444.48" y="134.5" width="141.04" height="13" rx="4" fill="#fbfaf7" fill-opacity=".95"/><text class="lblc" x="515.0" y="143">consume 1 query from quota</text><path class="lna" d="M254,182 L424,182"/><rect x="303.76" y="166.5" width="70.48" height="13" rx="4" fill="#fbfaf7" fill-opacity=".95"/><text class="lblc" x="339.0" y="175">invoke graph</text><path class="lnp" d="M436,214 L606,214"/><rect x="425.28" y="198.5" width="191.44" height="13" rx="4" fill="#fbfaf7" fill-opacity=".95"/><text class="lblc" x="521.0" y="207">triage, then plan sub-queries  (20B)</text><path class="lnp" d="M436,246 L606,246"/><rect x="422.76" y="230.5" width="196.48" height="13" rx="4" fill="#fbfaf7" fill-opacity=".95"/><text class="lblc" x="521.0" y="239">run searches, fetch and extract pages</text><path class="lnt dash" d="M436,278 L776,278"/><rect x="522.88" y="262.5" width="166.24" height="13" rx="4" fill="#fbfaf7" fill-opacity=".95"/><text class="lblc" x="606.0" y="271">retrieve from the user's corpus</text><path class="lnp" d="M436,310 L606,310"/><rect x="450.48" y="294.5" width="141.04" height="13" rx="4" fill="#fbfaf7" fill-opacity=".95"/><text class="lblc" x="521.0" y="303">synthesise a draft  (120B)</text><path class="lnp" d="M436,342 L606,342"/><rect x="415.2" y="326.5" width="211.6" height="13" rx="4" fill="#fbfaf7" fill-opacity=".95"/><text class="lblc" x="521.0" y="335">verify every claim independently  (120B)</text><path class="ln" d="M436,374 L484.0,374.0 Q490,374 490.0,380.0 L490.0,388.0 Q490,394 484.0,394.0 L440,394"/><text class="lbl" x="499" y="388">gap analysis: is the evidence enough?</text><path class="lna dash" d="M424,412 L357.0,412.0 Q348,412 348.0,403.0 L348.0,223.0 Q348,214 357.0,214.0 L422,214"/><text class="note" x="258" y="300.0" fill="#a94b2f">no - loop back</text><text class="note" x="258" y="313.5" fill="#a94b2f">to searching</text><path class="lnt" d="M436,442 L776,442"/><rect x="522.88" y="426.5" width="166.24" height="13" rx="4" fill="#fbfaf7" fill-opacity=".95"/><text class="lblc" x="606.0" y="435">persist report, tokens and cost</text><path class="lna" d="M424,474 L254,474"/><rect x="283.6" y="458.5" width="110.8" height="13" rx="4" fill="#fbfaf7" fill-opacity=".95"/><text class="lblc" x="339.0" y="467">stream report tokens</text><path class="ln" d="M242,506 L92,506"/><rect x="111.6" y="490.5" width="110.8" height="13" rx="4" fill="#fbfaf7" fill-opacity=".95"/><text class="lblc" x="167.0" y="499">render progressively</text><text class="note" x="24" y="556.0" fill="#6b6965">Responses are omitted for clarity. Every step also emits a progress event on the</text><text class="note" x="24" y="569.5" fill="#6b6965">same socket — that stream is what drives the live pipeline animation in the interface.</text></svg>