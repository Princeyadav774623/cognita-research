</style><rect width="880" height="498" fill="#ffffff"/><path class="ext" d="M42,60 L200,60 L188,110 L30,110 z"/><text class="tc" x="115.0" y="82.0">Supabase identity</text><text class="sc" x="115.0" y="96.0">user_id from a JWT</text><rect x="250" y="44" width="230" height="169" rx="7" fill="#fff" stroke="#1d5f63" stroke-width="1.5"/><path d="M250,70 h230" stroke="#1d5f63" stroke-width="1.2" opacity=".5"/><text class="tc" x="365.0" y="62">rag_documents</text><text class="lb" x="260" y="86">id</text><text class="lb" x="470" y="86" text-anchor="end" fill="#a06b21">PK</text><text class="lb" x="260" y="101">user_id</text><text class="lb" x="470" y="101" text-anchor="end" fill="#a06b21">FK</text><text class="lb" x="260" y="116">filename</text><text class="lb" x="260" y="131">file_type</text><text class="lb" x="260" y="146">status</text><text class="lb" x="260" y="161">char_count</text><text class="lb" x="260" y="176">chunk_count</text><text class="lb" x="260" y="191">error</text><text class="lb" x="260" y="206">created_at</text><rect x="560" y="44" width="250" height="124" rx="7" fill="#fff" stroke="#1d5f63" stroke-width="1.5"/><path d="M560,70 h250" stroke="#1d5f63" stroke-width="1.2" opacity=".5"/><text class="tc" x="685.0" y="62">rag_chunks</text><text class="lb" x="570" y="86">id</text><text class="lb" x="800" y="86" text-anchor="end" fill="#a06b21">PK</text><text class="lb" x="570" y="101">document_id</text><text class="lb" x="800" y="101" text-anchor="end" fill="#a06b21">FK</text><text class="lb" x="570" y="116">chunk_index</text><text class="lb" x="570" y="131">content</text><text class="lb" x="570" y="146">embedding  vector(384)</text><text class="lb" x="570" y="161">content_tsv  tsvector</text><rect x="250" y="252" width="230" height="79" rx="7" fill="#fff" stroke="#1d5f63" stroke-width="1.5"/><path d="M250,278 h230" stroke="#1d5f63" stroke-width="1.2" opacity=".5"/><text class="tc" x="365.0" y="270">rag_conversations</text><text class="lb" x="260" y="294">id</text><text class="lb" x="470" y="294" text-anchor="end" fill="#a06b21">PK</text><text class="lb" x="260" y="309">user_id</text><text class="lb" x="470" y="309" text-anchor="end" fill="#a06b21">FK</text><text class="lb" x="260" y="324">created_at</text><rect x="560" y="252" width="250" height="124" rx="7" fill="#fff" stroke="#1d5f63" stroke-width="1.5"/><path d="M560,278 h250" stroke="#1d5f63" stroke-width="1.2" opacity=".5"/><text class="tc" x="685.0" y="270">rag_messages</text><text class="lb" x="570" y="294">id</text><text class="lb" x="800" y="294" text-anchor="end" fill="#a06b21">PK</text><text class="lb" x="570" y="309">conversation_id</text><text class="lb" x="800" y="309" text-anchor="end" fill="#a06b21">FK</text><text class="lb" x="570" y="324">role</text><text class="lb" x="570" y="339">content</text><text class="lb" x="570" y="354">sources  (JSON text)</text><text class="lb" x="570" y="369">created_at</text><path class="lnt" d="M480,80 L556,80"/><text class="lb" x="496" y="72" fill="#1d5f63">1 : N</text><path class="lnt" d="M480,288 L556,288"/><text class="lb" x="496" y="280" fill="#1d5f63">1 : N</text><path class="lnt" d="M200,84 L225,84 L225,80 L246,80"/><path class="lnt" d="M200,96 L225,96 L225,288 L246,288"/><text class="lb" x="206" y="200" fill="#1d5f63">1 : N</text><text class="lb" x="30" y="132" fill="#7c7566">No local users</text><text class="lb" x="30" y="145" fill="#7c7566">table — identity</text><text class="lb" x="30" y="158" fill="#7c7566">lives in Supabase</text><text class="lb" x="30" y="372" fill="#7c7566">rag_chunks and rag_messages carry no user_id of their own. Their row-level security policies</text><text class="lb" x="30" y="385" fill="#7c7566">are derived — a chunk is visible only if its parent document is, and a message only if its</text><text class="lb" x="30" y="398" fill="#7c7566">conversation is. One fewer column to forget on insert, and no way for a chunk and its document</text><text class="lb" x="30" y="411" fill="#7c7566">to disagree about who owns them. Both foreign keys are ON DELETE CASCADE.</text><text class="lb" x="30" y="424" fill="#7c7566"></text><text class="lb" x="30" y="437" fill="#7c7566">embedding is vector(384) behind an HNSW index; content_tsv is a generated tsvector behind a GIN</text><text class="lb" x="30" y="450" fill="#7c7566">index. Both halves of hybrid retrieval are indexed on the same row, so fusion needs no join.</text><rect x="30" y="470" width="11" height="11" rx="3" fill="#fff" stroke="#1d5f63" stroke-width="1.6"/><text class="lb" x="47" y="479">entity and relationship</text><rect x="176.2" y="470" width="11" height="11" rx="3" fill="#fff" stroke="#a06b21" stroke-width="1.6"/><text class="lb" x="193.2" y="479">key column</text><rect x="252.2" y="470" width="11" height="11" rx="3" fill="#fff" stroke="#6b3352" stroke-width="1.6"/><text class="lb" x="269.2" y="479">outside the boundary</text></svg>