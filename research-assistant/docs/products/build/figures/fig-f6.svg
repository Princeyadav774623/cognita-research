</style><path d="M42,60 L200,60 L188,110 L30,110 z" fill="#f9f2f6" stroke="#6b3352" stroke-width="1.4" filter="url(#card)"/><text class="ttl" x="115.0" y="83.0">Supabase identity</text><text class="sub" x="115.0" y="98.0">user_id from a JWT</text><rect x="250" y="44" width="230" height="175" rx="12" fill="#fbfaf7" stroke="#1d5f63" stroke-width="1.4" filter="url(#card)"/><path d="M251,74 h228" stroke="#1d5f63" stroke-width="1.1" opacity=".45"/><text class="ttl" x="365.0" y="64">rag_documents</text><text class="lbl" x="262" y="90">id</text><text class="lbl" x="468" y="90" text-anchor="end" fill="#a94b2f" font-weight="600">PK</text><text class="lbl" x="262" y="105">user_id</text><text class="lbl" x="468" y="105" text-anchor="end" fill="#a94b2f" font-weight="600">FK</text><text class="lbl" x="262" y="120">filename</text><text class="lbl" x="262" y="135">file_type</text><text class="lbl" x="262" y="150">status</text><text class="lbl" x="262" y="165">char_count</text><text class="lbl" x="262" y="180">chunk_count</text><text class="lbl" x="262" y="195">error</text><text class="lbl" x="262" y="210">created_at</text><rect x="560" y="44" width="250" height="130" rx="12" fill="#fbfaf7" stroke="#1d5f63" stroke-width="1.4" filter="url(#card)"/><path d="M561,74 h248" stroke="#1d5f63" stroke-width="1.1" opacity=".45"/><text class="ttl" x="685.0" y="64">rag_chunks</text><text class="lbl" x="572" y="90">id</text><text class="lbl" x="798" y="90" text-anchor="end" fill="#a94b2f" font-weight="600">PK</text><text class="lbl" x="572" y="105">document_id</text><text class="lbl" x="798" y="105" text-anchor="end" fill="#a94b2f" font-weight="600">FK</text><text class="lbl" x="572" y="120">chunk_index</text><text class="lbl" x="572" y="135">content</text><text class="lbl" x="572" y="150">embedding  vector(384)</text><text class="lbl" x="572" y="165">content_tsv  tsvector</text><rect x="250" y="252" width="230" height="85" rx="12" fill="#fbfaf7" stroke="#1d5f63" stroke-width="1.4" filter="url(#card)"/><path d="M251,282 h228" stroke="#1d5f63" stroke-width="1.1" opacity=".45"/><text class="ttl" x="365.0" y="272">rag_conversations</text><text class="lbl" x="262" y="298">id</text><text class="lbl" x="468" y="298" text-anchor="end" fill="#a94b2f" font-weight="600">PK</text><text class="lbl" x="262" y="313">user_id</text><text class="lbl" x="468" y="313" text-anchor="end" fill="#a94b2f" font-weight="600">FK</text><text class="lbl" x="262" y="328">created_at</text><rect x="560" y="252" width="250" height="130" rx="12" fill="#fbfaf7" stroke="#1d5f63" stroke-width="1.4" filter="url(#card)"/><path d="M561,282 h248" stroke="#1d5f63" stroke-width="1.1" opacity=".45"/><text class="ttl" x="685.0" y="272">rag_messages</text><text class="lbl" x="572" y="298">id</text><text class="lbl" x="798" y="298" text-anchor="end" fill="#a94b2f" font-weight="600">PK</text><text class="lbl" x="572" y="313">conversation_id</text><text class="lbl" x="798" y="313" text-anchor="end" fill="#a94b2f" font-weight="600">FK</text><text class="lbl" x="572" y="328">role</text><text class="lbl" x="572" y="343">content</text><text class="lbl" x="572" y="358">sources  (JSON text)</text><text class="lbl" x="572" y="373">created_at</text><path class="lnt" d="M480,80 L556,80"/><rect x="492" y="63.5" width="34" height="12.5" rx="3" fill="#fbfaf7" fill-opacity=".88"/><text class="note" x="496" y="72.0" fill="#1d5f63">1 : N</text><path class="lnt" d="M480,288 L556,288"/><rect x="492" y="271.5" width="34" height="12.5" rx="3" fill="#fbfaf7" fill-opacity=".88"/><text class="note" x="496" y="280.0" fill="#1d5f63">1 : N</text><path class="lnt" d="M200,84 L223.0,84.0 Q225,84 225.0,82.0 L225.0,82.0 Q225,80 227.0,80.0 L246,80"/><path class="lnt" d="M200,96 L216.0,96.0 Q225,96 225.0,105.0 L225.0,279.0 Q225,288 234.0,288.0 L246,288"/><rect x="202" y="191.5" width="34" height="12.5" rx="3" fill="#fbfaf7" fill-opacity=".88"/><text class="note" x="206" y="200.0" fill="#1d5f63">1 : N</text><rect x="26" y="123.5" width="80" height="12.5" rx="3" fill="#fbfaf7" fill-opacity=".88"/><text class="note" x="30" y="132.0" fill="#6b6965">No local users</text><rect x="26" y="137.0" width="90" height="12.5" rx="3" fill="#fbfaf7" fill-opacity=".88"/><text class="note" x="30" y="145.5" fill="#6b6965">table — identity</text><rect x="26" y="150.5" width="96" height="12.5" rx="3" fill="#fbfaf7" fill-opacity=".88"/><text class="note" x="30" y="159.0" fill="#6b6965">lives in Supabase</text><rect x="26" y="363.5" width="482" height="12.5" rx="3" fill="#fbfaf7" fill-opacity=".88"/><text class="note" x="30" y="372.0" fill="#6b6965">rag_chunks and rag_messages carry no user_id of their own. Their row-level security policies</text><rect x="26" y="377.0" width="472" height="12.5" rx="3" fill="#fbfaf7" fill-opacity=".88"/><text class="note" x="30" y="385.5" fill="#6b6965">are derived — a chunk is visible only if its parent document is, and a message only if its</text><rect x="26" y="390.5" width="492" height="12.5" rx="3" fill="#fbfaf7" fill-opacity=".88"/><text class="note" x="30" y="399.0" fill="#6b6965">conversation is. One fewer column to forget on insert, and no way for a chunk and its document</text><rect x="26" y="404.0" width="384" height="12.5" rx="3" fill="#fbfaf7" fill-opacity=".88"/><text class="note" x="30" y="412.5" fill="#6b6965">to disagree about who owns them. Both foreign keys are ON DELETE CASCADE.</text><rect x="26" y="417.5" width="8" height="12.5" rx="3" fill="#fbfaf7" fill-opacity=".88"/><text class="note" x="30" y="426.0" fill="#6b6965"></text><rect x="26" y="431.0" width="497" height="12.5" rx="3" fill="#fbfaf7" fill-opacity=".88"/><text class="note" x="30" y="439.5" fill="#6b6965">embedding is vector(384) behind an HNSW index; content_tsv is a generated tsvector behind a GIN</text><rect x="26" y="444.5" width="482" height="12.5" rx="3" fill="#fbfaf7" fill-opacity=".88"/><text class="note" x="30" y="453.0" fill="#6b6965">index. Both halves of hybrid retrieval are indexed on the same row, so fusion needs no join.</text><rect x="30" y="470" width="12" height="12" rx="4" fill="#fff" stroke="#1d5f63" stroke-width="1.6"/><text class="lbl" x="48" y="479.5">entity and relationship</text><rect x="175.60000000000002" y="470" width="12" height="12" rx="4" fill="#fff" stroke="#a94b2f" stroke-width="1.6"/><text class="lbl" x="193.60000000000002" y="479.5">key column</text><rect x="253.60000000000002" y="470" width="12" height="12" rx="4" fill="#fff" stroke="#6b3352" stroke-width="1.6"/><text class="lbl" x="271.6" y="479.5">outside the boundary</text></svg>