ity=".5"/><text class="tc" x="440.0" y="268">rag_conversations</text><text class="lb" x="330" y="292">id</text><text class="lb" x="550" y="292" text-anchor="end" fill="#a06b21">PK</text><text class="lb" x="330" y="307">user_id</text><text class="lb" x="550" y="307" text-anchor="end" fill="#a06b21">FK</text><text class="lb" x="330" y="322">title</text><text class="lb" x="330" y="337">created_at</text><rect x="640" y="250" width="210" height="109" rx="7" fill="#fff" stroke="#1d5f63" stroke-width="1.5"/><path d="M640,276 h210" stroke="#1d5f63" stroke-width="1.2" opacity=".5"/><text class="tc" x="745.0" y="268">rag_messages</text><text class="lb" x="650" y="292">id</text><text class="lb" x="840" y="292" text-anchor="end" fill="#a06b21">PK</text><text class="lb" x="650" y="307">conversation_id</text><text class="lb" x="840" y="307" text-anchor="end" fill="#a06b21">FK</text><text class="lb" x="650" y="322">role</text><text class="lb" x="650" y="337">content</text><text class="lb" x="650" y="352">sources</text><path class="lnt" d="M240,80 L316,80"/><text class="lb" x="256" y="72" fill="#1d5f63">1 : N</text><path class="lnt" d="M560,80 L636,80"/><text class="lb" x="576" y="72" fill="#1d5f63">1 : N</text><path class="lnt" d="M140,123 L140,286 L316,286"/><text class="lb" x="148" y="200" fill="#1d5f63">1 : N</text><path class="lnt" d="M560,286 L636,286"/><text class="lb" x="576" y="278" fill="#1d5f63">1 : N</text><text class="lb" x="40" y="360" fill="#7c7566">rag_chunks and rag_messages carry no user_id of their own. Their row-level security</text><text class="lb" x="40" y="373" fill="#7c7566">policies are derived — a chunk is visible only if its parent document is, and a message</text><text class="lb" x="40" y="386" fill="#7c7566">only if its conversation is. One fewer column to forget, and no way for the two to</text><text class="lb" x="40" y="399" fill="#7c7566">disagree about who owns a row.</text><text class="lb" x="40" y="412" fill="#7c7566"></text><text class="lb" x="40" y="425" fill="#7c7566">embedding is vector(384) with an HNSW index; tsv is a generated tsvector with a GIN</text><text class="lb" x="40" y="438" fill="#7c7566">index. Both halves of hybrid retrieval are indexed in the same table.</text><rect x="40" y="468" width="11" height="11" rx="3" fill="#fff" stroke="#1d5f63" stroke-width="1.6"/><text class="lb" x="57" y="477">entity and relationship</text><rect x="186.2" y="468" width="11" height="11" rx="3" fill="#fff" stroke="#a06b21" stroke-width="1.6"/><text class="lb" x="203.2" y="477">key column</text></svg>