<svg viewBox="0 0 880 500" width="880" height="500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The two products and the platform they share">
  <rect width="880" height="500" fill="#ffffff"/>
  <style>
    .bdE{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.11em;font-weight:600}
    .bdN{font-family:'Plus Jakarta Sans',sans-serif;font-size:19px;font-weight:700;fill:#16150f}
    .bdB{font-family:'Newsreader',Georgia,serif;font-size:11.5px;fill:#474338}
    .bdS{font-family:'Plus Jakarta Sans',sans-serif;font-size:10.5px;fill:#474338}
    .bdL{font-family:'JetBrains Mono',monospace;font-size:9px;fill:#7c7566}
    .bdH{font-family:'Plus Jakarta Sans',sans-serif;font-size:12.5px;font-weight:700;fill:#16150f}
    .bdC{font-family:'Plus Jakarta Sans',sans-serif;font-size:9.5px;fill:#474338}
  </style>

  <text class="bdE" x="24" y="24" fill="#7c7566">TWO PRODUCTS — SEPARATE PAGES, SEPARATE QUERIES</text>

  <rect x="24" y="44" width="400" height="250" rx="12" fill="#ffffff" stroke="#a06b21" stroke-width="1.8"/><text class="bdE" x="44" y="70" fill="#a06b21">PRODUCT ONE  ·  /#research</text><text class="bdN" x="44" y="96">Deep Research</text><text class="bdB" x="44" y="117">You type a question. There is nothing to upload.</text><rect x="44" y="134" width="360" height="24" rx="6" fill="#fdfaf4" stroke="#a06b21" stroke-opacity=".35" stroke-width="1"/><text class="bdS" x="56" y="150">Plan the question into sub-queries</text><path d="M62,158 L62,164" stroke="#a06b21" stroke-opacity=".5" stroke-width="1.2"/><rect x="44" y="164" width="360" height="24" rx="6" fill="#fdfaf4" stroke="#a06b21" stroke-opacity=".35" stroke-width="1"/><text class="bdS" x="56" y="180">Search the open web, read the pages</text><path d="M62,188 L62,194" stroke="#a06b21" stroke-opacity=".5" stroke-width="1.2"/><rect x="44" y="194" width="360" height="24" rx="6" fill="#fdfaf4" stroke="#a06b21" stroke-opacity=".35" stroke-width="1"/><text class="bdS" x="56" y="210">Fact-check each claim, corroborate it</text><path d="M62,218 L62,224" stroke="#a06b21" stroke-opacity=".5" stroke-width="1.2"/><rect x="44" y="224" width="360" height="24" rx="6" fill="#fdfaf4" stroke="#a06b21" stroke-opacity=".35" stroke-width="1"/><text class="bdS" x="56" y="240">Cited report with a confidence score</text><text class="bdE" x="44" y="281" fill="#a06b21">EVIDENCE — FETCHED BY THE SYSTEM</text>

  <rect x="456" y="44" width="400" height="250" rx="12" fill="#ffffff" stroke="#1d5f63" stroke-width="1.8"/><text class="bdE" x="476" y="70" fill="#1d5f63">PRODUCT TWO  ·  /#files</text><text class="bdN" x="476" y="96">Chat with Files</text><text class="bdB" x="476" y="117">You upload documents first. No files, nothing to ask.</text><rect x="476" y="134" width="360" height="24" rx="6" fill="#f4f8f8" stroke="#1d5f63" stroke-opacity=".35" stroke-width="1"/><text class="bdS" x="488" y="150">Chunk, embed and store your files</text><path d="M494,158 L494,164" stroke="#1d5f63" stroke-opacity=".5" stroke-width="1.2"/><rect x="476" y="164" width="360" height="24" rx="6" fill="#f4f8f8" stroke="#1d5f63" stroke-opacity=".35" stroke-width="1"/><text class="bdS" x="488" y="180">Hybrid search: vectors + keywords (RRF)</text><path d="M494,188 L494,194" stroke="#1d5f63" stroke-opacity=".5" stroke-width="1.2"/><rect x="476" y="194" width="360" height="24" rx="6" fill="#f4f8f8" stroke="#1d5f63" stroke-opacity=".35" stroke-width="1"/><text class="bdS" x="488" y="210">Grade the passages, rewrite, retry</text><path d="M494,218 L494,224" stroke="#1d5f63" stroke-opacity=".5" stroke-width="1.2"/><rect x="476" y="224" width="360" height="24" rx="6" fill="#f4f8f8" stroke="#1d5f63" stroke-opacity=".35" stroke-width="1"/><text class="bdS" x="488" y="240">Answer from your files — or a refusal</text><text class="bdE" x="476" y="281" fill="#1d5f63">EVIDENCE — SUPPLIED BY YOU</text>

  <path d="M656,294 L656,318 L232,318 L232,300" fill="none" stroke="#a06b21" stroke-width="1.4" stroke-dasharray="5 4"/>
  <path d="M232,294 l-5,9 l10,0 z" fill="#a06b21"/>
  <text class="bdL" x="440" y="337" text-anchor="middle">the one crossing point — Deep Research may also read your uploaded files (FR-6)</text>

  <rect x="24" y="360" width="832" height="116" rx="12" fill="#f7f5f0" stroke="#7c7566" stroke-opacity=".35" stroke-width="1.4"/>
  <text class="bdE" x="44" y="386" fill="#7c7566">ONE PLATFORM UNDERNEATH</text>
  <text class="bdH" x="44" y="408">Shared by both — owned by neither</text>
  <rect x="44" y="424" width="142" height="30" rx="7" fill="#ffffff" stroke="#7c7566" stroke-opacity=".3"/><text class="bdC" x="115" y="443" text-anchor="middle">Accounts &amp; quota</text><rect x="196" y="424" width="142" height="30" rx="7" fill="#ffffff" stroke="#7c7566" stroke-opacity=".3"/><text class="bdC" x="267" y="443" text-anchor="middle">Tenant isolation (RLS)</text><rect x="348" y="424" width="142" height="30" rx="7" fill="#ffffff" stroke="#7c7566" stroke-opacity=".3"/><text class="bdC" x="419" y="443" text-anchor="middle">LLM retry &amp; fallback</text><rect x="500" y="424" width="142" height="30" rx="7" fill="#ffffff" stroke="#7c7566" stroke-opacity=".3"/><text class="bdC" x="571" y="443" text-anchor="middle">Token ledger</text><rect x="652" y="424" width="142" height="30" rx="7" fill="#ffffff" stroke="#7c7566" stroke-opacity=".3"/><text class="bdC" x="723" y="443" text-anchor="middle">Postgres + pgvector</text>
</svg>