server {
    listen 80;
    server_name localhost;

    # Must be >= the backend's MAX_FILE_SIZE_BYTES (15MB, see rag/ingest.py).
    # nginx defaults to 1m, which silently 413s every RAG document upload
    # larger than 1MB — i.e. most real PDFs — before the request ever
    # reaches FastAPI, so the backend's own limit never gets a say.
    client_max_body_size 15m;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy API requests to backend
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Document ingestion (parse + chunk + embed) runs inline in the
        # request, which can outlast the 60s default on a large PDF.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Reverse proxy WebSocket streams
    location /ws/ {
        proxy_pass http://backend:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
