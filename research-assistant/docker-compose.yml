services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: research_backend
    ports:
      # Bound to loopback, not 0.0.0.0. The browser reaches the API through
      # the frontend's nginx proxy, so the backend never needs to be publicly
      # reachable — and since it runs with --proxy-headers (see Dockerfile),
      # leaving it publicly exposed would let a caller bypass nginx and spoof
      # X-Forwarded-For to evade the IP rate limits. Still available on the
      # host at localhost:8000 for debugging and /docs.
      - "127.0.0.1:8000:8000"
    # backend/.env is the single source of truth for backend secrets (same
    # file the non-Docker `uvicorn api.main:app` run uses, since config.py
    # loads ".env" relative to backend/). Values below override it for
    # container-specific networking.
    env_file:
      - ./backend/.env
    environment:
      # Inside the compose network the database is reachable as "db", not
      # as whatever host backend/.env points at for local development.
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@db:5432/postgres}
      - APP_DATABASE_URL=${APP_DATABASE_URL:-postgresql://postgres:postgres@db:5432/postgres}
      - ENV=production
      - CORS_ORIGINS_RAW=${CORS_ORIGINS_RAW:-http://localhost:3000,http://localhost:5173,http://localhost:80}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Vite inlines this at build time, so it must be supplied to the
        # build, not the runtime container. Defaults to a same-origin
        # relative base so the browser's calls go through this container's
        # nginx reverse proxy (see frontend/nginx.conf) rather than
        # requiring the backend port to be publicly reachable.
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
    container_name: research_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    container_name: research_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
